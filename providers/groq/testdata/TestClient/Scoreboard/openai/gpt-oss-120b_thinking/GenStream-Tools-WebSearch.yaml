29, 2009. Retrieved December 9,\nL437: 2009.\nL438: \nL439: `{{cite web}}`: CS1 maint: periodical has ISBN (link)\nL440: \nL441: 20. 1 2 3 4 Government of Canada (1970). \"Governor General\" (PDF). WordPress. p.\nL442: 147. Retrieved March 14, 2024.\nL443: \nL444: 21. ↑ Government of Canada 1970, p. 146\nL445: \nL446: 22. ↑ Forsey, Eugene (March 2012). \"How Canadians Govern Themselves \u003e The Prime\nL447: Minister\". Queen's Printer for Canada. Retrieved November 26, 2015.\nL448: \nL449: 23. 1 2 Forsey 2005, p. 38\nL450: \nL451: 24. ↑ Grenier, Éric (July 12, 2018). \"NDP Leader Jagmeet Singh won't have a\nL452: free pass if he runs in a byelection\". CBC News.\nL453: \nL454: 25. 1 2 Forsey 2005, p. 5\nL455: \nL456: 26. ↑\"Consolidated federal laws of Canada, Canada Elections Act\". Legislative\nL457: Services Branch. Retrieved November 17, 2017.\nL458: \nL459: 27. ↑\"In the Wake of Constitutional Crisis: New Survey Demonstrates that\nL460: Canadians Lack Basic Understanding of Our Country's Parliamentary System\" (PDF).\nL461: Toronto: Ipsos Reid. December 15, 2008. p. 1. Archived from the original (PDF) on\nL462: December 16, 2008. Retrieved May 18, 2010.\nL463: \nL464: 28. ↑\"First Among Equals: The Prime Minister in Canadian Life and Politics \u003e\nL465: Alone at the Top \u003e Head of State\". Library and Archives Canada. Retrieved January\nL466: 18, 2010.\nL467: \nL468: 29. ↑ Brooks 2007, pp. 233–235\nL469: \nL470: 30. 1 2 Geddes, John (January 25, 2009). \"Will the prorogation of Parliament set\nL471: off a populist revolt?\". _Maclean's_. Toronto: Kenneth Whyte. ISSN 0024-9262.\nL472: Archived from the original on December 9, 2013. Retrieved January 27, 2010.\nL473: \nL474: 31. ↑\nL475: \nL476: Simpson, Jeffrey (2001). _The Friendly Dictatorship_. Toronto: McClelland \u0026\nL477: Stewart. p. 248. ISBN\nL478: \nL479: 978-0-7710-8079-1\nL480: \nL481: .\nL482: \nL483: 32. ↑ Coyne, Andrew (June 30, 2015). \"Liberals' idea for gender quota in\nL484: Cabinet
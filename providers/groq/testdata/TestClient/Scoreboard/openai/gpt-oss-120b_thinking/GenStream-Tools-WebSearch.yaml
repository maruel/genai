receives honorary degree\". _The University of\nL2817: Edinburgh_. Retrieved July 6, 2018.\nL2818: \nL2819: 402. ↑\"Justin Trudeau receives honourary \\[sic\\] degree from University of\nL2820: Edinburgh\", _Global News_, July 5, 2017, archived from the original on December\nL2821: 12, 2021, retrieved July 6, 2018\nL2822: \nL2823: 403. ↑\"Justin Trudeau's full commencement speech to NYU graduates\", _CBC News_,\nL2824: May 16, 2018, archived from the original on December 12, 2021, retrieved July 6,\nL2825: 2018\nL2826: \nL2827: 404. ↑\"2018 Honorees, Honorary Degrees \u0026 Speakers\". _NYU_.\nL2828: \nL2829: 405. ↑\"Trudeau accepts polio honor for Canada\". _Rotary International_. June\nL2830: 27, 2018. Retrieved February 24, 2025.\nL2831: \nL2832: 406. ↑\"Honorary Fellowship: Prime Minister Justin Trudeau\". _Canadian\nL2833: Geographic_. December 30, 2020. Retrieved February 24, 2025.\nL2834: \nL2835: 407. ↑\"2025 Global Leadership Award Honorees\". _Chicago Council on Global\nL2836: Affairs_. October 24, 2025. Retrieved February 24, 2026.\nL2837: \nL2838: - Biscahie, Thibault (November 14, 2019). \"Beyond the Mosaic: Justin Trudeau and\nL2839: the Postnational Chimera\". _London Journal of Canadian Studies_. **34** (1). doi:\nL2840: 10.14324/111.444.ljcs.2019v34.003. ISSN 2397-0928.\nL2841: \nL2842: - Bosworth, Yulia (January 2, 2019). \"The \"Bad\" French of Justin Trudeau: When\nL2843: Language, Ideology, and Politics Collide\". _American Review of Canadian Studies_.\nL2844: **49** (1): 5– 24. doi: 10.1080/02722011.2019.1570954. ISSN 0272-2011.\nL2845: \nL2846: - Clarke, Harold D.; Gravelle, Timothy B.; Scotto, Thomas J.; Stewart, Marianne\nL2847: C.; Reifler, Jason (July 2017). \"Like Father, Like Son: Justin Trudeau and\nL2848: Valence Voting in Canada's 2015 Federal Election\". _PS: Political Science \u0026\nL2849: Politics_. **50** (3): 701– 707. doi: 10.1017/S1049096517000452. hdl:\nL2850: 10871/28588. ISSN 1049-0965.\nL2851: \nL2852: - Coulon, Jocelyn (M
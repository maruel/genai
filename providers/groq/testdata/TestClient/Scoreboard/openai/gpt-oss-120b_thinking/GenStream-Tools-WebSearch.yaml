            data: {"id":"chatcmpl-0f0baf47-c03a-416b-9762-025239d65f79","object":"chat.completion.chunk","created":1790988215,"model":"openai/gpt-oss-120b","system_fingerprint":"fp_6b677c2caf","choices":[{"index":0,"delta":{"executed_tools":[{"name":"browser.open","index":4,"type":"browser.open","arguments":"{\n  \"cursor\": 3,\n  \"id\": 0\n}","output":"L0: \nL1: URL: https://en.wikipedia.org/wiki/Justin_Trudeau\nL2: Justin Trudeau\nL3: \nL4: The Right Honourable Justin Trudeau PC Trudeau in 2023 23rd Prime Minister of\nL5: Canada **In office**\nL6: \nL7: November 4, 2015 – March 14, 2025 Monarchs Elizabeth II Charles III Governors\nL8: General David Johnston Julie Payette Mary Simon Deputy Chrystia Freeland\nL9: (2019–2024)Preceded by Stephen Harper Succeeded by Mark Carney Leader of the\nL10: Liberal Party **In office**\nL11: \nL12: April 14, 2013 – March 9, 2025 Deputy Ralph Goodale (2013–2015)Preceded by\nL13: Bob Rae (interim)Succeeded by Mark Carney Minister of Intergovernmental Affairs\nL14: and Youth **In office**\nL15: \nL16: November 4, 2015 – July 18, 2018 \\[a\\]Prime Minister Himself Preceded by Denis\nL17: Lebel \\[b\\]Succeeded by Dominic LeBlanc \\[c\\]Member of Parliament\nL18: \nL19: for Papineau **In office**\nL20: \nL21: October 14, 2008 – April 27, 2025 Preceded by Vivian Barbot Succeeded by\nL22: Marjorie Michel Personal details Born Justin Pierre James Trudeau\nL23: \nL24: December 25, 1971 (age 54)\nL25: \nL26: Ottawa, Ontario, Canada Party Liberal Spouse Sophie Grégoire (m. 2005; sep.\nL27: 2023)Children 3, including Xavier Parents Pierre Trudeau Margaret Trudeau\nL28: Relatives Trudeau family Education McGill University (BA) University of British\nL29: Columbia (BEd)École Polytechnique de Montréal (no degree)Occupation Politician\nL30: teacher Signature Website House of Commons website Justin Trudeau's voice Trudeau\nL31: celebrating Canada Day\nL32: \nL33: Recorded July 1, 2018\nL34: \nL35: **Justin Pierre James Trudeau**\\[d\\] (born December 25, 1971) is a Canadian\nL36: politician who served as the 23rd prime minister of Canada from 2015 to 2025. He\nL37: led the Liberal Party from 2013 until his resignation in 2025 and was the member\nL38: of Parliament (MP) for Papineau from 2008 until 2025.\nL39: \nL40: Trudeau was born in Ottawa, Ontario, as the eldest child of then prime minister\nL41: Pierre Trudeau. He attended Collège Jean-de-Brébeuf and holds a Bachelor of\nL42: Arts degree in English from McGill University and a Bachelor of Education degree\nL43: from the University of British Columbia. He then taught at the secondary school\nL44: level in Vancouver before returning to Montreal in 2002 to further his studies.\nL45: From 2002 to 2006, he served as chair of Katimavik, a youth charity. In 2006, he\nL46: became chair of the Liberal Party's Task Force on Youth Renewal. In the 2008\nL47: federal election, Trudeau was elected to represent the riding of Papineau in the\nL48: House of Commons. He was appointed the Liberal Party's Official Opposition critic\nL49: for youth and multiculturalism in 2009 and critic for citizenship and immigration\nL50: in 2010. In 2011, he was appointed to be a critic for post secondary education,\nL51: youth and sport. Trudeau was elected as leader of the Liberal Party in 2013. In\nL52: the 2015 federal election, Trudeau led the Liberals to a majority government,\nL53: bringing the party from third party status with the largest-ever numerical\nL54: increase of seats by a party in a Canadian election. Aged 43, he became the\nL55: second-youngest prime minister in Canadian history (after Joe Clark) and was the\nL56: first to be the child of a previous prime minister.\nL57: \nL58: Upon assuming office, Trudeau introduced the Canada Child Benefit, legalized\nL59: medical assistance in dying, legalized recreational cannabis, pursued Senate\nL60: reform by creating the Independent Advisory Board for Senate Appointments, and\nL61: established the federal carbon tax. In foreign policy, Trudeau's government\nL62: resettled refugees of the Syrian civil war, signed the Paris Agreement on climate\nL63: change, and negotiated trade deals such as the Canada-United States-Mexico\nL64: Agreement (CUSMA) and the Comprehensive and Progressive Agreement for\nL65: Trans-Pacific Partnership (CPTPP). He was found twice to have violated conflict\nL66: of interest law by Canada's ethics commissioner—first in the Aga Khan affair,\nL67: and later in the SNC-Lavalin affair.\nL68: \nL69: Trudeau's Liberal Party was re-elected with a minority government in the 2019\nL70: federal election. From 2020, Trudeau responded to the COVID-19 pandemic and\nL71: subsequent recession by launching financial aid measures, a nationwide\nL72: vaccination campaign, and military support. His government also announced a ban\nL73: on \"assault-style\" weapons after the 2020 Nova Scotia attacks and introduced a\nL74: national $10-a-day child care program. He was investigated for a third time by\nL75: the ethics commissioner for his role in the WE Charity scandal, but was cleared\nL76: of any wrongdoing. Trudeau led the Liberals to another minority government in the\nL77: 2021 federal election. He then invoked the _Emergencies Act_ for the first time\nL78: in Canadian history in response to the Freedom Convoy protests; the Federal Court\nL79: later ruled against this action. His party signed a confidence and supply\nL80: agreement with the New Democratic Party (NDP) in early 2022, which resulted in\nL81: the introduction of the Canadian Dental Care Plan and a framework for national\nL82: pharmacare before the NDP withdrew from the agreement in late 2024. He also\nL83: launched a national school food program. Internationally, Trudeau's government\nL84: responded to the Russian invasion of Ukraine by imposing sanctions on Russia and\nL85: authorizing humanitarian and military aid to Ukraine. His premiership ended\nL86: during a trade war with the United States, to which he responded by introducing\nL87: 25% retaliatory tariffs on $ 30 billion of U.S. goods.\nL88: \nL89: Following a steady decline in popular support, the sudden resignation of deputy\nL90: prime minister Chrystia Freeland in December 2024 and an ensuing political\nL91: crisis, Trudeau announced in January 2025 that he would resign as prime minister\nL92: and leader of the Liberal Party. He advised the governor general to prorogue\nL93: Parliament until March 24, while the party held a leadership election. Trudeau\nL94: remained Liberal leader until Mark Carney was elected as his successor on March\nL95: 9. He resigned as prime minister five days later and stood down as an MP at the\nL96: 2025 federal election.\nL97: \nL98: ### Ancestry and birth\nL99: \nL100: On June 23, 1971, the Prime Minister's Office (PMO) announced that Prime Minister\nL101: Pierre Trudeau's wife of four months, Margaret Trudeau (née Sinclair), \\[1\\] was\nL102: pregnant and due in December. \\[2\\]\\[3\\] Justin Trudeau was born on December 25,\nL103: 1971, at 9:27 pm EST at the Ottawa Civic Hospital. \\[4\\] He is the second child\nL104: in Canadian history to be born to a prime minister in office; the first was John\nL105: A. Macdonald's daughter Margaret Mary Theodora Macdonald (February 8, 1869 –\nL106: January 28, 1933). Trudeau's younger brothers Alexandre \"Sacha\" (born December\nL107: 25, 1973) and Michel (October 2, 1975 – November 13, 1998) were the third and\nL108: fourth. \\[5\\]\\[6\\]\nL109: \nL110: Margaret Trudeau with Pat Nixon holding Justin at Rideau Hall in Ottawa in 1972\nL111: \nL112: Trudeau is predominantly of Scottish and French Canadian descent. \\[7\\] His\nL113: grandfathers were businessman Charles-Émile Trudeau \\[8\\] and Scottish-born\nL114: James Sinclair, \\[9\\] who was minister of fisheries in the cabinet of Prime\nL115: Minister Louis St. Laurent. \\[10\\] Trudeau's maternal great-grandfather Thomas\nL116: Bernard was born in Makassar, Indonesia \\[11\\] and immigrated to Penticton,\nL117: British Columbia, in 1906 at age 15 with his family. \\[12\\] Through the Bernard\nL118: family, kinsmen of the Earls of Bandon, \\[13\\]\\[14\\]\\[15\\] Trudeau is the fifth\nL119: great-grandson of Major-General William Farquhar, \\[16\\] a leader in the founding\nL120: of modern Singapore; Trudeau also has remote ethnic Malaccan \\[17\\]\\[18\\] and\nL121: Nias \\[19\\]\\[20\\]\\[21\\] ancestry.\nL122: \nL123: Trudeau was baptized with his father's niece Anne Rouleau-Danis as godmother and\nL124: his mother's brother-in-law Thomas Walker as godfather, \\[22\\]\\[23\\] at Ottawa's\nL125: Notre Dame Basilica on the afternoon of January 16, 1972, which marked his first\nL126: public appearance. \\[24\\] and given the names \"Justin Pierre James\". \\[25\\] On\nL127: April 14, 1972, Trudeau's father and mother hosted a gala at the National Arts\nL128: Centre, at which visiting U.S. president Richard Nixon said, \"I'd like to toast\nL129: the future prime minister of Canada, to Justin Pierre Trudeau\" to which Pierre\nL130: Trudeau responded that should his son ever assume the role, he hoped he would\nL131: have \"the grace and skill of the president\". \\[26\\] Earlier that day, first lady\nL132: Pat Nixon had visited him in his nursery and gifted him a stuffed toy Snoopy.\nL133: \\[27\\]\\[28\\]\nL134: \nL135: ### Childhood\nL136: \nL137: Trudeau's parents announced their separation in 1977, when he was five years old;\nL138: his father was given primary custody. \\[29\\] There were repeated rumours of a\nL139: reconciliation for many years afterwards. \\[30\\] However, his mother eventually\nL140: filed for a no-fault divorce which the Supreme Court of Ontario granted in 1984;\nL141: \\[31\\] his father had announced his intention to retire as prime minister a month\nL142: earlier. \\[32\\] Eventually, his parents came to an amicable joint-custody\nL143: arrangement and learned to get along quite well. Interviewed in October 1979, his\nL144: nanny Dianne Lavergne was quoted, \"Justin is a mommy's boy, so it's not easy, but\nL145: children's hurts mend very quickly. And they're lucky kids, anyway.\" \\[33\\] Of\nL146: his mother and father's marriage, Trudeau said in 2009, \"They loved each other\nL147: incredibly, passionately, completely. But there was 30 years between them, and my\nL148: mom never was an equal partner in what encompassed my father's life, his duty,\nL149: his country.\" \\[34\\] Trudeau has three half-siblings, Kyle and Alicia, from his\nL150: mother's remarriage to Fried Kemper, \\[35\\] and Sarah, from his father's\nL151: relationship with Deborah Coyne. \\[36\\]\nL152: \nL153: Trudeau watching a parade in Ottawa, June 1978\nL154: \nL155: Trudeau lived at 24 Sussex Drive, Ottawa, the official residence of Canada's\nL156: prime minister, from his birth until his father's government was defeated in the\nL157: 1979 federal election. The Trudeaus were expected to move into Stornoway, the\nL158: residence of the leader of the Official Opposition, but because of flooding in\nL159: the basement, Prime Minister Joe Clark offered them Harrington Lake, the prime\nL160: minister's official country retreat in Gatineau Park, with the expectation they\nL161: would move into Stornoway at the start of July. \\[37\\] However, the repairs were\nL162: not complete, so Pierre Trudeau took a prolonged vacation with his sons to the\nL163: Nova Scotia summer home of his friend, Member of Parliament Don Johnston, and\nL164: later sent his sons to stay with their maternal grandparents in North Vancouver\nL165: for the rest of the summer while he slept at his friend's Ottawa apartment.\nL166: Trudeau and his brothers returned to Ottawa for the start of the school year but\nL167: lived only on the top floor of Stornoway while repairs continued on the bottom\nL168: floor. \\[38\\] His mother purchased and moved into a new home nearby at 95\nL169: Victoria Street in Ottawa's New Edinburgh neighbourhood in September 1979.\nL170: \\[39\\]\\[40\\] Pierre Trudeau and his sons returned to the prime minister's\nL171: official residence after the February 1980 election that returned him to the\nL172: Prime Minister's Office. \\[41\\]\nL173: \nL174: 10-year-old Justin touring the Palais des Beaux-Arts de Lille in France with his\nL175: father in 1982\nL176: \nL177: His father had intended Trudeau to begin his formal education at a\nL178: French-language lycée, but Trudeau's mother convinced his father of the\nL179: importance of sending their sons to a public school. \\[42\\] In the end, Trudeau\nL180: was enrolled in 1976 in the French immersion program at Rockcliffe Park Public\nL181: School. It was the same school his mother had attended for two years while her\nL182: father was a member of Parliament. \\[43\\] He could have been dropped off by\nL183: limousine, but his parents elected he take the school bus albeit with a Royal\nL184: Canadian Mounted Police (RCMP) car following. \\[44\\]\\[45\\]\\[46\\]\\[47\\]\nL185: \nL186: After his father's retirement in June 1984, his mother remained at her New\nL187: Edinburgh home while the rest of the family moved into his father's home at 1418\nL188: Pine Avenue, Montreal known as Cormier House; \\[48\\] the following autumn, he\nL189: began attending the private Collège Jean-de-Brébeuf, his father's alma mater.\nL190: The school had begun as a Jesuit school but was non-denominational by the time\nL191: Justin matriculated. \\[49\\]\\[50\\] In 2008, Trudeau said that of all his early\nL192: family outings he enjoyed camping with his father the most, because \"that was\nL193: where our father got to be just our father – a dad in the woods\". \\[51\\] During\nL194: the summers his father would send him and his brothers to Camp Ahmek, on Canoe\nL195: Lake in Algonquin Provincial Park, where he would later work in his first paid\nL196: job as a camp counsellor. \\[52\\]\\[53\\]\\[54\\]\\[55\\]\\[56\\]\nL197: \nL198: Trudeau and his brothers were given shares in two numbered companies by their\nL199: father: the first containing a portfolio of securities, from which they receive\nL200: regular dividends, up to $20,000 per year; and the second which receives\nL201: royalties from their father's autobiography and other sources, about $10,000 a\nL202: year. \\[57\\] As of August 2011, the first numbered company had assets of $1.2\nL203: million. \\[58\\] The Trudeau brothers were also given a country estate of about 50\nL204: hectares in the Laurentians with a home designed by the esteemed Canadian\nL205: architect Arthur Erickson, and the Cormier House in Montreal. \\[59\\]\\[57\\]\\[60\\]\nL206: The country estate land was estimated to be worth $2.7 million in 2016. \\[60\\]\nL207: \nL208: ### University and early career\nL209: \nL210: Trudeau earned a Bachelor of Arts degree in literature from McGill University in\nL211: 1994 and a Bachelor of Education degree from the University of British Columbia\nL212: in 1998. \\[61\\]\\[62\\] In his first year at McGill, Trudeau became acquainted with\nL213: his future principal secretary, Gerald Butts, through their mutual friend,\nL214: Jonathan Ablett. \\[63\\] Butts invited Trudeau to join the McGill Debating Union.\nL215: \\[64\\] They bonded while driving back to Montreal after a debate tournament at\nL216: Princeton University. \\[63\\] After graduation, Trudeau stayed in Vancouver where\nL217: he became a substitute teacher at local schools such as Killarney Secondary and\nL218: worked permanently as a French and math teacher at the private West Point Grey\nL219: Academy. He became a roommate at the Douglas Lodge \\[65\\] with fellow West Point\nL220: Grey Academy faculty member and friend Christopher Ingvaldson. \\[63\\]\\[66\\] From\nL221: 2002 to 2004, he studied engineering at the École Polytechnique de Montréal,\nL222: affiliated with Université de Montréal, but did not graduate. \\[67\\] He started\nL223: a master's degree in environmental geography at McGill but withdrew from the\nL224: program to seek public office. \\[68\\]\nL225: \nL226: In August 2000, Trudeau attended the Kokanee Summit in Creston, British Columbia,\nL227: to raise funds in honour of his brother Michel Trudeau and other avalanche\nL228: victims. After the event, an unsigned editorial in the _Creston Valley Advance_\nL229: (a local newspaper) accused Trudeau of having groped an unnamed female reporter\nL230: while at the music festival. The editorial stated Trudeau provided a \"day-late\"\nL231: apology to the reporter, saying, \"If I had known you were reporting for a\nL232: national paper, I never would have been so forward\". \\[69\\]\\[70\\] In 2018,\nL233: Trudeau was questioned about the groping incident but said he did not remember\nL234: any negative incidents from that time. His apology and later statement about the\nL235: event have been described as hypocritical, while responses to the story have\nL236: described it as a witch hunt or non-story. \\[71\\]\nL237: \nL238: External videos \"Trudeau delivers the eulogy at his father Pierre Trudeau's\nL239: funeral\". – The National – CBC/Radio-Canada, October 3, 2000. (12:07 mins).\nL240: Archive (12:02 mins)\nL241: \nL242: In October 2000, Trudeau, then 28, emerged as a prominent figure after delivering\nL243: a eulogy at his father's state funeral. \\[72\\]\\[73\\]\\[74\\] The Canadian\nL244: Broadcasting Corporation (CBC) received numerous calls to rebroadcast the speech\nL245: after its initial transmission, and leading Quebec politician Claude Ryan\nL246: described it as \"perhaps ... the first manifestation of a dynasty\". \\[75\\] A book\nL247: issued by the CBC in 2003 included the speech in its list of significant Canadian\nL248: events from the past fifty years. \\[76\\]\nL249: \nL250: In 2007, Trudeau starred in the two-part CBC Television miniseries _The Great\nL251: War_, which gave an account of Canada's participation in the First World War. He\nL252: portrayed his fifth cousin, twice removed, \\[77\\] Major Talbot Mercer Papineau,\nL253: who was killed on October 30, 1917, during the Battle of Passchendaele. \\[78\\]\nL254: Trudeau is one of several children of former prime ministers who have become\nL255: Canadian media personalities. The others are Ben Mulroney (son of Brian\nL256: Mulroney), Catherine Clark (daughter of Joe Clark), and Trudeau's younger\nL257: brother, Alexandre. \\[79\\] Ben Mulroney was a guest at Trudeau's wedding. \\[80\\]\nL258: \nL259: ### Advocacy\nL260: \nL261: Trudeau (middle) in 2007 with \"Maison des Grands-Parents\" co-founders Lucille\nL262: Girard and Jacqueline Desjardins, during the 15th anniversary of the non-profit\nL263: seniors organization.\nL264: \nL265: Trudeau and his family started the Kokanee Glacier Alpine Campaign for winter\nL266: sports safety in 2000, two years after his brother Michel died in an avalanche\nL267: during a ski trip. \\[81\\] In 2002, Trudeau criticized the Government of British\nL268: Columbia's decision to stop its funding for a public avalanche warning system.\nL269: \\[82\\]\\[83\\]\nL270: \nL271: From 2002 to 2006, Trudeau chaired the Katimavik youth program, a project started\nL272: by longtime family friend Jacques Hébert. \\[84\\]\\[85\\]\nL273: \nL274: In 2002–03, Trudeau was a panellist on CBC Radio's _Canada Reads_ series, where\nL275: he championed _The Colony of Unrequited Dreams_ by Wayne Johnston. \\[86\\]\\[87\\]\nL276: Trudeau and his brother Alexandre inaugurated the Trudeau Centre for Peace and\nL277: Conflict Studies at the University of Toronto in April 2004; the centre later\nL278: became a part of the Munk School of Global Affairs. \\[88\\] In 2006, he hosted the\nL279: presentation ceremony for the Giller Prize for literature. \\[89\\]\\[90\\]\nL280: \nL281: In 2005, Trudeau fought against a proposed $100-million zinc mine that he argued\nL282: would poison the Nahanni River, a United Nations World Heritage Site located in\nL283: the Northwest Territories. He was quoted as saying, \"The river is an absolutely\nL284: magnificent, magical place. I'm not saying mining is wrong ... but that is not\nL285: the place for it. It's just the wrong thing to be doing.\" \\[91\\]\\[92\\]\nL286: \nL287: On September 17, 2006, Trudeau was the master of ceremonies at a Toronto rally\nL288: organized by Roméo Dallaire that called for Canadian participation in resolving\nL289: the Darfur crisis. \\[93\\]\\[94\\]\nL290: \nL291: ## Political beginnings\nL292: \nL293: Trudeau supported the Liberal Party from a young age, offering his support to\nL294: party leader John Turner in the 1988 federal election. \\[95\\] Two years later, he\nL295: defended Canadian federalism at a student event at the Collège Jean-de-Brébeuf,\nL296: which he attended. \\[96\\]\nL297: \nL298: Following his father's death, Trudeau became more involved with the Liberal Party\nL299: throughout the 2000s. Along with Olympian Charmaine Crooks, he co-hosted a\nL300: tribute to outgoing prime minister Jean Chrétien at the party's 2003 leadership\nL301: convention, and was appointed to chair a task force on youth renewal after the\nL302: party's defeat in the 2006 federal election. \\[97\\]\\[98\\]\nL303: \nL304: Trudeau at the 2006 Liberal Party leadership convention.\nL305: \nL306: In October 2006, Trudeau criticized Quebec nationalism by describing political\nL307: nationalism generally as an \"old idea from the 19th century\", \"based on a\nL308: smallness of thought\" and not relevant to modern Quebec. This comment was seen as\nL309: a criticism of Michael Ignatieff, then a candidate in the 2006 Liberal Party\nL310: leadership election, who was promoting recognition of Quebec as a nation.\nL311: \\[99\\]\\[100\\] Trudeau later wrote a public letter on the subject, describing the\nL312: idea of Quebec nationhood as \"against everything my father ever believed\".\nL313: \\[101\\]\\[102\\]\nL314: \nL315: Trudeau announced his support for leadership candidate Gerard Kennedy shortly\nL316: before the 2006 convention and introduced Kennedy during the candidates' final\nL317: speeches. \\[103\\] When Kennedy dropped off after the second ballot, Trudeau\nL318: joined him in supporting the ultimate winner, Stéphane Dion. \\[104\\]\\[105\\]\nL319: \nL320: Rumours circulated in early 2007 that Trudeau would run in an upcoming\nL321: by-election in the Montreal riding of Outremont. The Montreal newspaper _La\nL322: Presse_ reported despite Trudeau's keenness, Liberal leader Stéphane Dion wanted\nL323: Outremont for a star candidate who could help rebuild the Liberal Party. Instead,\nL324: Trudeau announced that he would seek the Liberal nomination in the nearby riding\nL325: of Papineau for the next general election. \\[106\\]\\[107\\]\\[108\\] The riding,\nL326: which had been held for 26 years by André Ouellet, a senior minister under his\nL327: father, had been in Liberal hands for 53 years before falling to the Bloc\nL328: Québécois in 2006. \\[109\\]\nL329: \nL330: On April 29, 2007, Trudeau won the Liberal party's nomination, winning 690 votes\nL331: to 350 for Mary Deros, a Montreal city councillor, and 220 for Basilio Giordano,\nL332: the publisher of a local Italian-language newspaper. \\[110\\]\nL333: \nL334: ## Opposition (2008–2015)\nL335: \nL336: 2008 Trudeau promotional portrait by Jean-Marc Carisse\nL337: \nL338: Prime Minister Stephen Harper called an election for October 14, 2008, by which\nL339: time Trudeau had been campaigning for a year in Papineau. On election day,\nL340: Trudeau narrowly defeated Bloc Québécois incumbent Vivian Barbot. \\[111\\]\nL341: Following his election win, Edward Greenspon, editor-in-chief of _The Globe and\nL342: Mail_, noted that Trudeau would \"be viewed as few other rookie MPs are—as a\nL343: potential future Prime Minister—and scrutinized through that lens\". \\[51\\]\nL344: \nL345: The Conservative Party won a minority government in the 2008 election, and\nL346: Trudeau entered parliament as a member of the Official Opposition. Trudeau's\nL347: first legislative act was a motion that called for the creation of a \"national\nL348: voluntary service policy for young people\". \\[112\\] He later co-chaired the\nL349: Liberal Party's April 2009 national convention in Vancouver, and in October of\nL350: the same year he was appointed as the party's critic for multiculturalism and\nL351: youth. \\[113\\]\nL352: \nL353: In September 2010, he was reassigned as critic for youth, citizenship, and\nL354: immigration. \\[114\\] During that time, he criticized the government's legislation\nL355: targeting human smuggling, which he argued would penalize the victims of\nL356: smuggling. \\[115\\]\nL357: \nL358: Trudeau sparked controversy when it was revealed that he earned $1.3 million in\nL359: public speaking fees from charities and school boards across Canada, $277,000 of\nL360: which Trudeau received after becoming an MP. \\[116\\]\\[117\\]\nL361: \nL362: He encouraged an increase of Canada's relief efforts after the 2010 Haiti\nL363: earthquake, and sought more accessible immigration procedures for Haitians moving\nL364: to Canada in the time of crisis. His own riding includes a significant Haitian\nL365: community. \\[118\\]\nL366: \nL367: Trudeau was re-elected in Papineau in the 2011 federal election, as the Liberal\nL368: Party fell to third-party standing in the House of Commons with only thirty-four\nL369: seats. Ignatieff resigned as party leader immediately after the election, and\nL370: rumours again circulated that Trudeau could run to become his successor. On this\nL371: occasion, Trudeau said, \"I don't feel I should be closing off any options...\nL372: because of the history packaged into my name, a lot of people are turning to me\nL373: in a way that... to be blunt, concerns me.\" \\[119\\]\\[120\\] Weeks after the\nL374: election, Toronto MP Bob Rae was selected as the interim leader until the party's\nL375: leadership convention, which was later decided to be held in April 2013. Rae\nL376: appointed Trudeau as the party's critic for post-secondary education, youth and\nL377: amateur sport. \\[121\\] After his re-election, he travelled the country hosting\nL378: fundraisers for charities and the Liberal Party. \\[122\\]\\[123\\]\\[124\\]\\[125\\]\nL379: \nL380: Trudeau wanted to take part in a charity boxing match on behalf of the cancer\nL381: research fundraising event Fight for the Cure, but was having difficulty finding\nL382: a Conservative opponent until Conservative senator Patrick Brazeau agreed when\nL383: asked on Trudeau's behalf by their mutual hairdresser Stefania Capovilla.\nL384: \\[126\\]\\[127\\] The fight took place on March 31, 2012, at the Hampton Inn in\nL385: Ottawa, and it was broadcast live on Sun News with commentary by Ezra Levant and\nL386: Brian Lilley. Trudeau won in the third round; the result was considered an upset.\nL387: \\[126\\]\\[128\\]\nL388: \nL389: #### Earlier speculation\nL390: \nL391: After Dion's resignation as Liberal leader in 2008, Trudeau's name was mentioned\nL392: as a potential candidate with polls showing him as a favourite among Canadians\nL393: for the position. \\[129\\]\\[130\\]\nL394: \nL395: However, Trudeau did not enter the race and Michael Ignatieff was named leader in\nL396: December 2008. \\[131\\] After the party's poor showing in the 2011 election,\nL397: Ignatieff resigned from the leadership and Trudeau was again seen as a potential\nL398: candidate to lead the party. \\[132\\]\nL399: \nL400: Trudeau at a demonstration in Ottawa against tuition fees, February 2012\nL401: \nL402: Following the election, Trudeau said he was undecided about seeking the\nL403: leadership; \\[133\\] months later on October 12 at Wilfrid Laurier University, he\nL404: announced he would not seek the post because he had a young family. \\[134\\] When\nL405: interim leader Bob Rae, who was also seen as a frontrunner, announced he would\nL406: not be entering the race in June 2012, Trudeau was hit with a \"tsunami\" of calls\nL407: from supporters to reconsider his earlier decision to not seek the leadership.\nL408: \\[135\\]\nL409: \nL410: Opinion polling conducted by several pollsters showed that if Trudeau were to\nL411: become leader the Liberal Party would surge in support, from a distant third\nL412: place to either being competitive with the Conservative Party or leading them.\nL413: \\[136\\] In July 2012, Trudeau stated that he would reconsider his earlier\nL414: decision to not seek the leadership and would announce his final decision at the\nL415: end of the summer. \\[137\\]\\[138\\]\nL416: \nL417: #### 2013 leadership election\nL418: \nL419: On September 26, 2012, multiple media outlets started reporting that Trudeau\nL420: would launch his leadership bid the following week. \\[139\\]\\[140\\] While Trudeau\nL421: was seen as a frontrunner for the leadership of the Liberal Party, he was\nL422: criticized for his perceived lack of substance. \\[141\\]\\[142\\] During his time as\nL423: a member of Parliament, he spoke little on policy matters and it was not known\nL424: where he stood on many issues such as the economy and foreign affairs.\nL425: \\[143\\]\\[144\\] Some strategists and pundits believed the leadership would be the\nL426: time for Trudeau to be tested on these issues; however, there was also fear\nL427: within the party that his celebrity status and large lead might deter other\nL428: strong candidates from entering the leadership race. \\[145\\]\\[146\\]\\[147\\]\nL429: \nL430: On October 2, 2012, Trudeau held a rally in Montreal to launch his bid for the\nL431: leadership of the Liberal Party. \\[148\\] The core people on his campaign team\nL432: were considered longtime friends, and all in their 30s and 40s. His senior\nL433: advisor was Gerald Butts, the former president of WWF-Canada who had previously\nL434: been principal secretary to former Ontario premier Dalton McGuinty. Other senior\nL435: aides included campaign manager Katie Telford, and policy advisors Mike McNeir\nL436: and Robert Asselin, who had all worked for recent Liberal Party leaders. \\[149\\]\nL437: His brother Alexandre also took a break from his documentary work to be a senior\nL438: advisor on Trudeau's campaign. \\[150\\]\nL439: \nL440: During the leadership campaign, three by-elections were held on November 26,\nL441: 2012. The riding Calgary Centre was expected to be a three-way race between the\nL442: Conservatives, Liberals and Green Party. A week before by-election day Sun Media\nL443: reported on comments Trudeau had made in a 2010 interview with Télé-Québec, in\nL444: which he said, \"Canada isn't doing well right now because it's Albertans who\nL445: control our community and socio-democratic agenda.\" Trudeau's campaign advisor\nL446: said that the comments were being brought up now because of the close race in\nL447: Calgary Centre. \\[151\\] The following day, Trudeau apologized, saying he was\nL448: wrong to use \"Alberta\" as \" shorthand\" in referring to Stephen Harper's\nL449: government. \\[152\\] The Conservatives held onto Calgary Centre in the by-election\nL450: by less than 1,200 votes. Liberal candidate Harvey Locke said he lost the\nL451: by-election on his own and that comments made by Trudeau did not influence the\nL452: outcome. \\[153\\]\nL453: \nL454: Fellow leadership candidate Marc Garneau, seen as Trudeau's main challenger in\nL455: the race, criticized Trudeau for not releasing enough substantial policy\nL456: positions. Garneau called on him to release more detailed policies before members\nL457: and supporters begin to vote. \\[154\\] Garneau later challenged Trudeau to a\nL458: one-on-one debate, and said that if Trudeau could not defend his ideas in a\nL459: debate against him, he wouldn't be able to do so against Prime Minister Harper.\nL460: \\[155\\] Trudeau clashed in debates with challenger Joyce Murray, who was the only\nL461: Liberal leadership candidate to speak out strongly in favour of electing the\nL462: House of Commons with a system of proportional representation. She challenged\nL463: Trudeau over his support for a preferential ballot voting system. \\[156\\]\nL464: \nL465: On March 13, 2013, Garneau dropped out of the leadership race, saying that\nL466: polling conducted by his campaign showed he would be unable to defeat Trudeau.\nL467: \\[157\\]\\[158\\]\nL468: \nL469: With Joyce Murray, the last challenger, receiving significant press time, more\nL470: Liberal politicians and public figures declared themselves for Trudeau. Trudeau\nL471: was declared the winner of the leadership election on April 14, 2013, garnering\nL472: 80.1% of 30,800 votes. \\[159\\] Joyce Murray finished in second place with 10.2%,\nL473: ahead of Martha Hall Findlay's 5.7%. \\[160\\] Trudeau had lost only five ridings,\nL474: all to Murray and all in BC. \\[161\\]\nL475: \nL476: ##### Early leadership (2013–2015)\nL477: \nL478: Trudeau campaigning in Toronto's Trinity—Spadina riding in support of Liberal\nL479: candidate Adam Vaughan, June 2014 \\[162\\]\nL480: \nL481: In the days following his victory in the leadership race, snapshot polls recorded\nL482: a surge in support for the Liberal party. \\[163\\]\nL483: \nL484: In 2013, Trudeau chose to give up his seat at the funeral of Nelson Mandela, in\nL485: deference to Irwin Cotler as representative of the Liberal Party of Canada,\nL486: because of Cotler's work for and with Nelson Mandela in fighting apartheid.\nL487: \\[164\\]\nL488: \nL489: During the leadership campaign, Trudeau pledged to park all his assets, exclusive\nL490: of real estate holdings, into a blind trust which is atypical for opposition MPs,\nL491: including leaders. According to documents obtained by the _Ottawa Citizen_, he\nL492: fulfilled the pledge in July 2013 when the blind trust was set up by BMO Private\nL493: Banking. \\[165\\]\nL494: \nL495: Trudeau launched an internet video the week before the 2014 Liberal party\nL496: convention titled \"An economy that benefits us all\" in which he narrates his\nL497: economic platform. He said that Canada's debt to GDP ratios have come down in\nL498: recent years and now it's time for Ottawa to \"step up\". \\[166\\]\nL499: \nL500: #### 2015 federal election\nL501: \nL502: Trudeau at the Vancouver Pride Festival, shortly after launching his election\nL503: campaign\nL504: \nL505: On October 19, 2015, after the longest official campaign in over a century,\nL506: Trudeau led the Liberals to a decisive victory in the federal election. The\nL507: Liberals won 184 of the 338 seats, with 39.5% of the popular vote, for a strong\nL508: majority government; \\[167\\]\\[168\\] a gain of 150 seats compared to the 2011\nL509: federal election. \\[167\\]\nL510: \nL511: This was the second-best performance in the party's history. The Liberals won\nL512: mostly on the strength of a solid performance in the eastern half of the country.\nL513: In addition to taking all of Atlantic Canada and Toronto, \\[167\\] they won 40\nL514: seats in Quebec—the most that the Liberals had won in that province since\nL515: Trudeau's father led them to a near-sweep of the province in 1980, and also the\nL516: first time since then that the Liberals won a majority of Quebec's seats in an\nL517: election. The 150-seat gain was the biggest numerical increase for a single party\nL518: since Confederation and marked the first time that a party had rebounded from\nL519: third place in the Commons to a majority government.\nL520: \nL521: In addition to the appeal of his party's platform, Trudeau's success has been\nL522: credited to his performance both on the campaign trail and televised leaders'\nL523: debates exceeding the lowered expectations created by Conservative advertisements\nL524: and conservative media outlets. \\[169\\]\\[170\\]\\[171\\]\nL525: \nL526: The Trudeau Liberals slogan during the 2015 campaign was \"Real Change\"\nL527: \nL528: Trudeau declared victory shortly after CBC News projected that he had won a\nL529: majority government. He began his speech with a reference to former Liberal prime\nL530: minister Wilfrid Laurier's \"sunny ways\" (French: _voies ensoleillées_) approach\nL531: to bringing Canadians together despite their differences. According to Trudeau,\nL532: Laurier \"knew that politics can be a positive force, and that's the message\nL533: Canadians have sent today\". \\[172\\] Harper announced his resignation as the\nL534: leader of the Conservative Party that night. \\[173\\]\\[174\\]\nL535: \nL536: ## Prime Minister of Canada (2015–2025)\nL537: \nL538: ### Swearing-in\nL539: \nL540: The 29th Canadian Ministry after being sworn into office, November 4, 2015\nL541: \nL542: Trudeau and the rest of the Cabinet were sworn in by Governor General David\nL543: Johnston on November 4, 2015. He said that his first legislative priority was to\nL544: lower taxes for middle-income Canadians and raise taxes for the top 1% of income\nL545: earners after parliament was reconvened on December 3, 2015. \\[175\\] Trudeau also\nL546: issued a statement promising to rebuild relations with Indigenous peoples in\nL547: Canada and run an open, ethical and transparent government. \\[176\\]\nL548: \nL549: ### Domestic policy\nL550: \nL551: Trudeau with Maryam Monsef and Marie-Claude Bibeau at the 2019 Women Deliver\nL552: event in Vancouver.\nL553: \nL554: The Trudeau government's economic policy initially relied on increased tax\nL555: revenues to pay for increased government spending. While the government has not\nL556: balanced the budget, it reduced Canada's debt-to-GDP ratio every year until 2020,\nL557: when the COVID-19 pandemic hit. \\[177\\]\\[178\\] Trudeau's self-described\nL558: progressive and feminist social policy has included strong advocacy for abortion\nL559: rights. \\[179\\] His government introduced the bill that made conversion therapies\nL560: illegal in Canada. \\[180\\] Canada introduced the right to medically-assisted\nL561: dying in 2016, \\[181\\] and legalized cannabis for recreational use in 2018.\nL562: \\[182\\] In 2021, Trudeau announced the creation of a national child care plan\nL563: with the intention of reducing day care fees for parents down to $10 a day per\nL564: child within five years. \\[183\\]\nL565: \nL566: His environmental policy included introducing new commitments to reducing\nL567: greenhouse gas emissions by 30% before 2030, and to achieve net-zero emissions by\nL568: 2050. \\[184\\] His main tool for reaching this target is a federal carbon pricing\nL569: policy. \\[185\\] Trudeau's parliament also adopted legislation for marine\nL570: conservation, \\[186\\] banning six common single-use plastic products, \\[187\\] and\nL571: strengthening environmental impact assessments. \\[188\\] Trudeau pledged to ban\nL572: single use plastic in 2019. In 2022, his government announced a ban on producing\nL573: and importing single use plastic from December 2022. The sale of those items will\nL574: be banned from December 2023 and the export from 2025. \\[189\\] However, Trudeau\nL575: is in favour of oil and gas pipelines to bring Canadian fossil fuel resources to\nL576: foreign markets. \\[190\\]\nL577: \nL578: Before winning the 2015 election, Trudeau promised to accept 50,000 refugees from\nL579: Syria and Iraq by the end of 2016. \\[191\\]\\[192\\]\\[193\\] In 2016, Trudeau's\nL580: advisors recommended drastically increasing immigration levels to stimulate the\nL581: economy. \\[194\\] Despite warnings about the impact of rapid population growth on\nL582: housing and services, Trudeau's government increased targets each year, reaching\nL583: almost 1 million newcomers (permanent and temporary residents) in both 2022 and\nL584: 2023. \\[195\\]\\[196\\]\\[197\\] In November 2022, the Trudeau government announced\nL585: that Canada would admit 500,000 immigrants per year by 2025. \\[198\\] Trudeau\nL586: initiated measures to combat housing inflation such as banning foreign buyers and\nL587: creating the Housing Accelerator Fund, but asserted in a May 2024 interview that,\nL588: \"housing needs to retain its value\". \\[199\\]\\[200\\] In October 2024, as Canadians\nL589: endured cost of living and housing crises, and as Trudeau's unpopularity grew, he\nL590: announced cuts to immigration targets in a video message.\nL591: \\[201\\]\\[202\\]\\[203\\]\\[204\\] This had little effect on Trudeau's approval rating,\nL592: however, which had plummeted from 65% in 2016 to 22% in December 2024.\nL593: \\[205\\]\\[206\\] In 2024, food bank usage was also at an all-time high and more\nL594: working people than ever were using food banks, \\[207\\] which occurred amidst\nL595: global food crises at the time. Reports released in early 2025 suggested that\nL596: population growth would not be significantly slowed even with the Trudeau\nL597: government's proposed cuts. \\[208\\]\\[209\\]\\[210\\]\nL598: \nL599: On September 22, 2023, Yaroslav Hunka, a Ukrainian Canadian who fought in the SS\nL600: Division Galicia of the military wing of the Nazi Party, the _Waffen-SS_, was\nL601: invited to the House of Commons of Canada to be recognized by Speaker Anthony\nL602: Rota, the Member of Parliament for Hunka's district. Hunka received two standing\nL603: ovations from all house members, including Justin Trudeau, other party leaders,\nL604: and visiting Ukrainian president Volodymyr Zelenskyy. The incident, seen as a\nL605: political blunder \\[211\\]\\[212\\] and a scandal, such that it drew comparisons to\nL606: the most embarrassing moments in Canada's history, \\[213\\] was leveraged by the\nL607: Russian establishment to further its justifications for the 2022 Russian invasion\nL608: of Ukraine. Trudeau said, \"this is a mistake that deeply embarrassed parliament\nL609: and Canada\", and apologized to President Zelenskyy. \\[214\\]\nL610: \nL611: Trudeau giving a speech on the issue of missing and murdered Indigenous women,\nL612: October 2016\nL613: \nL614: As prime minister, Trudeau launched three major independent investigations: the\nL615: National Inquiry into Missing and Murdered Indigenous Women (MMIWG), the Joint\nL616: Federal/Provincial Commission into the 2020 Nova Scotia attacks (in partnership\nL617: with the Government of Nova Scotia), \\[215\\] and the Public Inquiry into Foreign\nL618: Interference in Federal Electoral Processes and Democratic Institutions. The\nL619: latter was called in response to allegations of Chinese government interference\nL620: in the 2019 and 2021 Canadian federal elections, but also deals with interference\nL621: from other states deemed hostile to Canada. \\[216\\] The MMIWG investigation found\nL622: that Canada's response to this issue amounts to genocide, a finding Trudeau said\nL623: he accepted. \\[217\\]\nL624: \nL625: Trudeau chose the following jurists to be appointed as justices of the Supreme\nL626: Court of Canada: Richard Wagner (as chief justice), Malcolm Rowe, Sheilah Martin,\nL627: Nicholas Kasirer, Mahmud Jamal, Michelle O'Bonsawin, and Mary Moreau. He\nL628: appointed the first visible minority and Indigenous Canadian to the court.\nL629: \nL630: #### COVID-19 pandemic\nL631: \nL632: Trudeau and British Prime Minister Boris Johnson elbow bump while wearing face\nL633: masks as a COVID-19 precaution during the 47th G7 summit, June 2021\nL634: \nL635: Trudeau was prime minister during the worldwide COVID-19 pandemic. His\nL636: government's response to the pandemic included funds for provinces and\nL637: territories to adapt to the new situation, funds for coronavirus research, travel\nL638: restrictions, screening of international flights, self-isolation orders under the\nL639: _Quarantine Act_, an industrial strategy, and a public health awareness campaign.\nL640: Initially, Canada faced a shortage of personal protective equipment, as the\nL641: Trudeau government had cut PPE stockpile funding in the previous years.\nL642: \\[218\\]\\[219\\]\nL643: \nL644: To deal with the economic impact of the pandemic in 2020, Trudeau waived student\nL645: loan payments, increased the Canada Child Benefit, doubled the annual Goods and\nL646: Services Tax payment, and introduced the Canada Emergency Response Benefit (CERB)\nL647: as part of a first package in March. In April 2020, Trudeau introduced the Canada\nL648: Emergency Wage Subsidy, the Canada Emergency Business Account, and the Canada\nL649: Emergency Student Benefit. \\[220\\] Trudeau also deployed the Canadian Forces in\nL650: long-term care homes in Quebec and Ontario as part of Operation LASER. \\[221\\]\nL651: \nL652: Throughout the pandemic, the federal government was also responsible for the\nL653: procurement of COVID-19 vaccines. \\[222\\] On May 12, 2020, the Trudeau government\nL654: announced it had reached an exclusive deal with CanSino Biologics. \\[223\\]\nL655: However, due to deteriorating Canadian-Chinese relations, the Cansino deal fell\nL656: through. \\[224\\] On August 5, 2020, the Trudeau government created a plan to\nL657: secure doses of the Pfizer and Moderna vaccines. \\[225\\] Starting in December\nL658: 2020, Trudeau oversaw the implementation of Canada's mass-vaccination program.\nL659: \\[226\\]\\[222\\]\nL660: \nL661: The spread of COVID-19 in Canada continued beyond the initial outbreak, with a\nL662: strong second wave in the fall of 2020 and an even more serious third wave in the\nL663: spring of 2021. \\[227\\]\\[228\\] Throughout the crisis, Trudeau periodically\nL664: extended the scope and duration of the federal aid programs. The 2021 Canadian\nL665: federal budget planned to phase them out by the end of September 2021, and\nL666: projected a $354.2-billion deficit in the 2020–21 fiscal year. \\[229\\] While\nL667: CERB was indeed phased out on September 26, the Canada Recovery Benefit (CBR)\nL668: continued to provide support until October 23. \\[230\\] The Canada Worker Lockdown\nL669: Benefit was introduced that month to replace the CBR, and expanded during the\nL670: spread of the Omicron variant in December 2021. \\[231\\]\nL671: \nL672: #### Freedom Convoy and _Emergencies Act_ invocation\nL673: \nL674: A protest sign on Parliament Hills fence during the Canadian truckers convoy\nL675: protest, January 2022\nL676: \nL677: The Canada convoy protest, called the Freedom Convoy, was a protest in Canada\nL678: against COVID-19 vaccine requirements for truckers to re-enter the country by\nL679: land introduced by the Government of Canada on January 15, 2022. Originally\nL680: composed of several routes traversing all of the Canadian provinces, the truck\nL681: convoys converged on Ottawa.\nL682: \nL683: On January 29, the first day of protest at Parliament Hill, Trudeau moved to an\nL684: undisclosed location. \\[232\\]\\[233\\] According to _The Guardian_, the\nL685: demonstration developed to express a number of \"antigovernment grievances\",\nL686: particularly against Trudeau. \\[234\\] On January 31, Trudeau called the protests\nL687: an \"insult to truth\". \\[235\\] On February 3, he said that a military response was\nL688: \"not in the cards right now\". \\[236\\] On February 11, _Reuters_ reported that\nL689: Trudeau promised the US \"quick action\" regarding protesters who have forcefully\nL690: blocked the Ambassador Bridge on the US-Canada border, the continent's \"busiest\nL691: land border crossing\". \\[237\\] Trudeau subsequently indicated that there would be\nL692: \"robust police intervention\" and called for all protesters to \"go home\". \\[238\\]\nL693: \nL694: Trudeau invoked the _Emergencies Act_ on February 14, 2022, for the first time\nL695: since it was enacted in 1988, as a result of the public order emergency caused by\nL696: the demonstrations in Ottawa. \\[239\\] On February 23, 2022, Trudeau announced\nL697: that the federal government would revoke the emergency declaration. Later that\nL698: day, the governor general signed a proclamation revoking it. \\[240\\]\\[241\\] A\nL699: year later, on February 17, 2023, a judicial inquiry into the use of the\nL700: _Emergencies Act_ concluded that the Trudeau government met the legal threshold\nL701: required to invoke the act. \\[242\\] In early 2024, Federal Court judge Richard\nL702: Mosley ruled that the federal government's invocation of the Emergencies Act to\nL703: end the 2022 convoy protest was \"not justified\" and infringed on Charter rights.\nL704: \\[243\\]\\[244\\] The federal government lost its appeal of the ruling in January\nL705: 2026. \\[245\\]\nL706: \nL707: #### 2019 federal election\nL708: \nL709: On September 11, 2019, Trudeau visited Governor General Julie Payette, to request\nL710: the dissolution of Parliament, and formally triggering an election. \\[246\\] Prior\nL711: to the formal start of the campaign, Trudeau announced his intention to only\nL712: participate in the three leaders' debates, two organized by the Leaders' Debates\nL713: Commission, and one organized by TVA. \\[247\\] Other leader's debates were either\nL714: cancelled or took place with an empty podium left on stage for Trudeau.\nL715: \\[248\\]\\[249\\]\nL716: \nL717: In September 2019, controversial pictures and video were published showing\nL718: Trudeau in brownface and blackface. \\[250\\] On September 18, 2019, _Time_\nL719: magazine published a photograph of Trudeau wearing brownface makeup in the spring\nL720: of 2001, at an _Arabian Nights_-themed gala, while Trudeau was a teacher at West\nL721: Point Grey Academy. \\[251\\] Trudeau publicly apologized, agreeing the photo was\nL722: racist and saying: \"I shouldn't have done that. I should have known better and I\nL723: didn't. I'm really sorry.\" \\[252\\] He further went on to say \"It was something\nL724: that I didn't think was racist at the time, but now I recognize it was something\nL725: racist to do\". \\[253\\] Trudeau also admitted to wearing blackface makeup in high\nL726: school while singing \" Day-O\" at a talent show that was subsequently published by\nL727: Global News. \\[254\\] A third instance, a video, of Trudeau in racist dress was\nL728: also published. \\[254\\] After this video was published, Trudeau admitted he could\nL729: not remember how often he had worn blackface makeup. \\[255\\] In the days\nL730: following the scandal, pollsters pointed out that many Canadians either were not\nL731: bothered by the scandal or had accepted Trudeau's apology.\nL732: \\[256\\]\\[257\\]\\[258\\]\\[259\\] Additionally, some minority community groups,\nL733: racialized commentators and some of Trudeau's opponents came to his defence.\nL734: \\[260\\]\\[261\\]\\[262\\]\\[263\\] Others were more critical, including members of his\nL735: own party. \\[264\\]\nL736: \nL737: While Trudeau's Liberal Party lost 20 seats in the House of Commons (lowering its\nL738: total from 177 to 157) from the time of dissolution, they still won the most\nL739: seats of any party—enough to allow Trudeau to form a minority government.\nL740: \\[265\\]\\[266\\] For the first time since 1979, the party that garnered the largest\nL741: share of the national popular vote did not win the most seats; the Liberals under\nL742: Trudeau had 33.1% of the popular vote, while the Conservatives under Andrew\nL743: Scheer had 34.4%. \\[267\\]\\[268\\]\nL744: \nL745: #### 2021 federal election\nL746: \nL747: On August 15, 2021, Trudeau advised Governor General Mary Simon to dissolve\nL748: parliament, scheduling an election for September 20. \\[269\\] The election was\nL749: called on the same day as the Fall of Kabul. In the first two weeks of the\nL750: campaign, Trudeau received criticism for not acting fast enough in the face of\nL751: the 2021 Taliban offensive to evacuate Canadian citizens and Afghans who\nL752: supported Canada's military and diplomatic efforts during the War in Afghanistan.\nL753: \\[270\\] The Liberals called the election to win a majority government and govern\nL754: alone. \\[271\\]\nL755: \nL756: In the 2021 federal election, Trudeau secured a third mandate and his second\nL757: minority government after winning 160 seats. However, the Liberals came in second\nL758: in the national popular vote, behind the Conservatives. \\[272\\] They received\nL759: 32.6% of the popular vote, the lowest percentage of the national popular vote for\nL760: a governing party in Canadian history. \\[273\\] The results were mostly unchanged\nL761: from the 2019 federal election. \\[271\\]\nL762: \nL763: ##### Confidence and supply agreement\nL764: \nL765: On March 22, 2022, the Liberals and the NDP entered a supply and confidence\nL766: agreement, in which the NDP committed to supporting the Liberals in all votes of\nL767: confidence for the duration of the 44th Parliament. \\[274\\] In exchange, the\nL768: Liberal Party would back key NDP priorities, including national dental care for\nL769: low-income Canadians, national pharmacare, labour reforms for federally-regulated\nL770: workers, and new taxes on financial institutions. \\[274\\]\nL771: \nL772: In September 2024, the NDP pulled their support and ended the supply and\nL773: confidence agreement. \\[275\\] The Conservative Party made three failed\nL774: no-confidence motions in September, October, and December, \\[276\\]\\[277\\] all of\nL775: which did not receive NDP support. On December 20, 2024, NDP leader Jagmeet Singh\nL776: pledged to put forward another no-confidence motion and vote out Trudeau's\nL777: government. \\[278\\]\nL778: \nL779: ### Foreign policy\nL780: \nL781: In 2015, Trudeau told the _New York Times Magazine_ that Canada could be the\nL782: \"first postnational state\". \\[279\\]\nL783: \nL784: Trudeau speaking with U.S. president Barack Obama in the White House's Oval\nL785: Office, 2016\nL786: \nL787: Trudeau enjoyed good relations with the \"like-minded\" United States president\nL788: Barack Obama, \\[280\\] despite Trudeau's support for the Keystone Pipeline, which\nL789: was rejected by the Democratic president. \\[281\\] Trudeau's first foreign policy\nL790: challenges included follow-through on his campaign promise to withdraw Canadian\nL791: air support from the Syrian civil war \\[282\\] and to welcome 25,000 Syrian war\nL792: refugees. \\[283\\]\nL793: \nL794: In 2016, Trudeau lifted visa requirements for Mexican citizens. Asylum claims by\nL795: Mexicans grew from 110 in 2015 to 24,000 in 2023. Visas and some restrictions\nL796: were reinstated in 2024. \\[284\\]\\[285\\]\nL797: \nL798: Trudeau with Mexican president Enrique Peña Nieto at Parliament Hill, 2016\nL799: \nL800: In January 2017, Trudeau wrote, \"To those fleeing persecution, terror \u0026 war,\nL801: Canadians will welcome you, regardless of your faith. Diversity is our strength\nL802: #WelcomeToCanada,\" on Twitter. As a result, irregular border crossing increased,\nL803: mainly at Roxham Road. \\[286\\]\\[287\\] Increased strain on services in Quebec and\nL804: Ontario, and criticism over the unsustainable influx of claimants, appeared to\nL805: influence the decision to close Roxham Road in March 2023; however, the new terms\nL806: of the Canada–United States Safe Third Country Agreement (STCA) had been\nL807: arranged the previous year. \\[288\\] After irregular border crossings were shut\nL808: down, asylum claims surged at airports. \\[289\\]\nL809: \nL810: Trudeau signing CUSMA alongside US president Donald Trump and Mexican president\nL811: Enrique Peña Nieto, 2018.\nL812: \nL813: When Donald Trump became president in 2017, Canada-US relations deteriorated. The\nL814: Trump administration forced the renegotiation of NAFTA to create the CUSMA, in\nL815: which Canada made significant concessions in allowing increased imports of\nL816: American milk, weakening Canada's dairy supply management system. \\[290\\]\\[291\\]\nL817: Donald Trump also implemented tariffs on Canadian steel and aluminum, to which\nL818: Trudeau retaliated by imposing tariffs on American steel, aluminum and a variety\nL819: of other American products. \\[292\\]\nL820: \nL821: Canada's relationship with China also deteriorated during Trudeau's time as prime\nL822: minister. The turmoil led to the arrest of Meng Wanzhou at the Vancouver\nL823: International Airport in December 2018 at the behest of the United States,\nL824: \\[293\\] and the arrest of Michael Spavor and Michael Kovrig in China 12 days\nL825: later. \\[294\\] Trudeau appointed Liberal advisor, Dominic Barton (McKinsey \u0026\nL826: Company, Century Initiative) ambassador to China in 2019. While Barton negotiated\nL827: the release of Spavor and Kovrig, Canada-China trade reached historic highs.\nL828: Barton resigned in December 2021, \"amidst growing pressure from...President Joe\nL829: Biden for Ottawa to take a tougher stance with Beijing.\" \\[295\\] As Wanzhou,\nL830: Spavor and Kovrig were released at the exact same time in September 2021, many\nL831: observers speculated they were exchanged as part of a deal between the United\nL832: States and China. \\[296\\] Trudeau greeted Spavor and Kovrig at the airport upon\nL833: their repatriation. In 2024, Spavor was awarded $7 million in compensation for\nL834: his arrest and detainment. Although Trudeau repeatedly claimed the two were\nL835: arbitrarily targeted, it was later reported Spavor had unwittingly participated\nL836: in espionage by sharing information on North Korea with Kovrig who then passed it\nL837: onto the Canadian government. \\[297\\]\\[298\\]\nL838: \nL839: Trudeau speaking during the second day of the 2018 G20 Buenos Aires summit\nL840: \nL841: In a similar fashion, Canada's relationship with Saudi Arabia was also put under\nL842: strain, as human rights groups called on Trudeau to stop selling military\nL843: equipment to that country under a deal struck by the Harper government. In 2018,\nL844: Saudi Arabia recalled its Canadian ambassador and froze trade with the country in\nL845: response to Canada's call for the Saudis to release opposition blogger Raif\nL846: Badawi. However, in 2019, Canada doubled its weapons sales to Saudi Arabia,\nL847: despite a \"moratorium on export permits following the killing of the Saudi\nL848: journalist Jamal Khashoggi and mounting civilian deaths from the Saudi\nL849: Arabian-led intervention in Yemen.\" \\[299\\]\nL850: \nL851: In 2020, Canada lost its bid to join the United Nations Security Council. This\nL852: was the second time Canada had failed an attempt to join the Security Council,\nL853: the first time being in 2009 under Prime Minister Stephen Harper. \\[300\\]\nL854: \nL855: In September 2023, Trudeau said that the government of Canada had \"credible\nL856: intelligence\" that the government of India was involved in the killing of a\nL857: Canadian citizen, Hardeep Singh Nijjar, outside a Sikh gurdwara in Surrey. This\nL858: episode triggered the Canada–India diplomatic row. \\[301\\]\nL859: \nL860: On October 7, 2023, Trudeau condemned the Hamas-led surprise attack on Israel,\nL861: which devolved into the Gaza war, and expressed his support to Israel and its\nL862: right to self-defence. \\[302\\] On October 24, he rejected calls for a ceasefire\nL863: but said he supported \"humanitarian pauses\" to deliver aid to the people of the\nL864: Gaza Strip. \\[303\\] On December 12, in a joint statement with the Prime Minister\nL865: of Australia and the Prime Minister of New Zealand, Trudeau called for a\nL866: \"sustainable ceasefire\" in the war. \\[304\\] Trudeau neither endorsed nor rejected\nL867: South Africa's genocide case against Israel. \\[305\\]\nL868: \nL869: Trudeau announces the Government of Canada's response to U.S. tariffs, 2025\nL870: \nL871: Following Donald Trump's second inauguration in January 2025, Canada-US relations\nL872: again deteriorated. On March 4, 2025, President Trump imposed 25% tariffs on\nL873: Canadian exports, 10% tariffs on Canadian energy products, with an exemption for\nL874: the automotive industry set to expire on April 2. In retaliation, Trudeau\nL875: announced countermeasures, with Canada imposing 25% tariffs on $30 billion worth\nL876: of U.S. goods, effective March 5, 2025. These retaliatory tariffs were set to\nL877: increase to $155 billion worth of U.S. products within 21 days and would remain\nL878: in place until the U.S. trade actions were withdrawn. \\[306\\]\\[307\\]\nL879: \nL880: On March 8, while giving a speech at the National Forum on Combatting\nL881: Antisemitism, Trudeau identified himself as a Zionist. \\[308\\]\nL882: \nL883: #### Foreign interference\nL884: \nL885: In 2022 and 2023, Canadian media reported that the People's Republic of China had\nL886: made attempts to interfere in the 2019 Canadian federal election and 2021\nL887: Canadian federal election. \\[309\\]\\[310\\]\\[311\\]\\[312\\]\nL888: \nL889: Canadian opposition parties demanded a public inquiry into election interference.\nL890: Rejecting a full public inquiry, Trudeau nominated former Governor General of\nL891: Canada David Johnston to investigate the allegations. Johnston delivered a report\nL892: in May 2023, which described China's interference as a danger to Canadian\nL893: democracy, stated that some of the media reports were partially incorrect, and\nL894: that the Canadian intelligence services and Canadian government needed to make\nL895: several improvements to counter the threat and protect members of Parliament.\nL896: \\[313\\]\nL897: \nL898: Following Johnston's resignation on June 9, Justin Trudeau commissioned Québec\nL899: justice Marie-Josée Hogue to preside over the _Public Inquiry into Foreign\nL900: Interference in Federal Electoral Processes and Democratic Institutions_. In May\nL901: 2024, the inquiry issued its preliminary report, finding that China engaged in\nL902: foreign interference in both elections, but the interference did not affect the\nL903: ultimate result of either election. \\[314\\]\nL904: \nL905: ### Ethics\nL906: \nL907: Trudeau was criticized by opposition members in November 2016 for his fundraising\nL908: tactics, which they saw as \"cash for access\" schemes. \\[315\\] Trudeau attended\nL909: fundraisers where attendees paid upwards of $1500 for access to him and other\nL910: cabinet members. \\[316\\]\\[317\\] In some instances, the events were attended by\nL911: foreign businessmen who needed government approval for their businesses. \\[318\\]\nL912: Trudeau defended his fundraising tactics, saying that they were not in breach of\nL913: any ethics rules. He also stated that he was lobbied at the fundraisers but not\nL914: influenced. \\[317\\] In 2017, Trudeau introduced legislation that would eliminate\nL915: such exclusive events by requiring increased transparency for political\nL916: fundraisers. \\[319\\]\nL917: \nL918: In January 2017, the ethics commissioner, Mary Dawson, began an investigation\nL919: into Trudeau for a vacation he and his family took to Aga Khan IV's private\nL920: island in the Bahamas. \\[320\\]\\[321\\] The ethics commissioner's report, released\nL921: in December 2017, found that Trudeau had violated four provisions of the 2006\nL922: _Conflict of Interest Act_. \\[322\\] He became the first prime minister to break\nL923: the modern federal conflict of interest law. \\[323\\]\\[324\\] In 2022, it was\nL924: reported that the Royal Canadian Mounted Police had considered bringing criminal\nL925: charges against Trudeau over the affair. \\[325\\]\\[326\\]\nL926: \nL927: Trudeau signs a guestbook at the Golden Temple in Amritsar, India, in 2018.\nL928: \nL929: In February 2018, Trudeau was criticized when his government invited Khalistani\nL930: nationalist Jaspal Atwal to the Canadian High Commission's dinner party in Delhi.\nL931: Atwal had previously been convicted for the shooting and attempted murder of\nL932: Indian Cabinet minister Malkiat Singh Sidhu in 1986, as well as the assault on\nL933: former BC premier Ujjal Dosanjh in 1985. Following the dinner, the PMO rescinded\nL934: the invitation, and apologized for the incident. \\[327\\]\nL935: \nL936: #### SNC-Lavalin affair\nL937: \nL938: Trudeau at the 2018 Vancouver Pride Parade, accompanied by then- Minister of\nL939: Justice and Attorney General Jody Wilson-Raybould, who would later be central to\nL940: the SNC-Lavalin affair in 2019.\nL941: \nL942: On February 8, 2019, _The Globe and Mail_ reported that sources close to the\nL943: government said that the Prime Minister's Office had allegedly attempted to\nL944: influence Attorney General Jody Wilson-Raybould concerning an ongoing prosecution\nL945: of SNC-Lavalin. The charges allege that between 2001 and 2011, SNC-Lavalin paid\nL946: CA$48 million in bribes in Libya to officials in the government of Muammar\nL947: Gaddafi. When asked about the allegations, Trudeau said that the story in the\nL948: _Globe_ was false and that he had never \"directed\" Wilson-Raybould concerning the\nL949: case. \\[328\\] Wilson-Raybould did not comment on the matter, citing\nL950: solicitor-client privilege. \\[329\\] Soon after, Trudeau voluntarily waived\nL951: privilege and cabinet confidences, permitting her to speak. \\[330\\] On February\nL952: 11, the ethics commissioner announced the opening of an investigation into the\nL953: allegations. Trudeau said he \"welcomed the investigation\". \\[331\\]\\[332\\] The\nL954: Justice Committee of the House of Commons has conducted a series of hearings on\nL955: the alleged interference. \\[333\\]\\[334\\]\\[335\\] The investigation heard from\nL956: several witnesses, including Jody Wilson-Raybould, who submitted as evidence a\nL957: telephone call she secretly recorded between herself and Privy Council Clerk\nL958: Michael Wernick, which was subsequently released to the public. \\[336\\] On the\nL959: recording, Wernick is heard asking to understand why the \"DPA route\" is not being\nL960: used, stating that people were \"talking past each other\", and suggesting Trudeau\nL961: obtain independent legal advice from former Supreme Court chief justice Beverly\nL962: McLachlin. Wilson-Raybould is heard suggesting that Trudeau would be \"breaching a\nL963: constitutional principle of prosecutorial independence\". On March 19, 2019, the\nL964: Liberal committee members voted as a bloc to shut down the Justice Committee's\nL965: investigation. \\[337\\]\nL966: \nL967: Trudeau was the subject of an investigation by the ethics commissioner, pursuant\nL968: to the _Conflict of Interest Act_, in regard to criminal charges against\nL969: SNC-Lavalin in the SNC-Lavalin affair. The commission's final report, issued\nL970: August 14, 2019, concluded \"Mr. Trudeau contravened section 9 of the Act\".\nL971: \\[338\\]\\[339\\]\\[340\\]\\[341\\]\\[342\\]\nL972: \nL973: #### WE Charity investigation\nL974: \nL975: Following complaints by opposition parties that the Trudeau family had ties to WE\nL976: Charity, the ethics commissioner on July 3, 2020, announced an investigation into\nL977: Trudeau's and the government's decision to have the charity administer a summer,\nL978: student-grant program which could assist students financially during the COVID-19\nL979: pandemic. Trudeau responded by saying WE was the charity that had the capability\nL980: to administer such a program. WE and the federal government decided to \"part\nL981: ways\" leaving administration of the grant program to the federal government.\nL982: \\[343\\]\\[344\\]\\[345\\]\nL983: \nL984: WE Charity was criticized for its close ties to the Trudeau family; the\nL985: investigation came after revelations that Trudeau's mother, brother, and wife\nL986: were paid nearly $300,000 in total to speak at WE Charity events.\nL987: \\[346\\]\\[347\\]\\[348\\] On July 16, 2020, the ethics commissioner also announced\nL988: the investigation was being expanded to include Finance Minister Bill Morneau.\nL989: \\[349\\] Trudeau was ultimately cleared of any wrongdoing by the ethics\nL990: commissioner though Morneau was found to have broken the conflict of interest\nL991: law. \\[350\\]\nL992: \nL993: ### Resignation\nL994: \nL995: Following the 2021 federal election, the Liberals faced declining poll numbers\nL996: and disappointing results in by-elections, including losses in safe seats such as\nL997: Toronto—St. Paul's in Toronto and LaSalle—Émard—Verdun in Montreal.\nL998: \\[351\\] The months following these losses saw frequent media stories about\nL999: internal frustration and discontent with Trudeau's leadership. This appeared to\nL1000: culminate in a caucus meeting where multiple members called on Trudeau to resign.\nL1001: Trudeau emerged from this meeting stating that the party remained \"strong and\nL1002: united\". \\[352\\]\nL1003: \nL1004: The closing months of 2024 saw a wave of resignations in Trudeau's cabinet. On\nL1005: September 19, Minister of Transport Pablo Rodriguez resigned to run for\nL1006: leadership of the Quebec Liberal Party. \\[353\\] On November 20, Alberta MP Randy\nL1007: Boissonnault resigned following allegations that he ran a business seeking\nL1008: federal contracts and falsely claimed to be Indigenous. \\[354\\] On December 15,\nL1009: Housing Minister Sean Fraser announced his intention to leave the federal cabinet\nL1010: in the next shuffle, citing family reasons. \\[355\\]\\[356\\]\nL1011: \nL1012: Trudeau seated next to Chrystia Freeland in 2018. Freeland's resignation from\nL1013: Trudeau's Cabinet in December 2024 led to the political crisis.\nL1014: \nL1015: On December 16, 2024, Chrystia Freeland resigned as Deputy Prime Minister and\nL1016: Minister of Finance, hours before she was due to release the government's fall\nL1017: economic statement. \\[357\\] Freeland was often nicknamed the \"minister of\nL1018: everything\", and widely seen as a potential successor to Trudeau for the\nL1019: leadership of the Liberal Party. \\[358\\]\\[359\\] In her resignation letter,\nL1020: Freeland reported Trudeau had asked her to resign as finance minister and that\nL1021: she would be offered another Cabinet position. She instead decided to resign\nL1022: altogether from his Cabinet, saying that \"to be effective, a Minister must speak\nL1023: on behalf of the Prime Minister and with his full confidence. In making your\nL1024: decision, you made clear that I no longer credibly enjoy that confidence.\"\nL1025: \\[360\\]\nL1026: \nL1027: Freeland's resignation came amid threats from the incoming Trump administration\nL1028: to impose 25% tariffs upon Canada, \\[361\\] as well as Freeland's reported\nL1029: opposition to Trudeau's promise of $250 cheques to working Canadians who earned\nL1030: $150,000 or less in 2023. \\[362\\] The resignation raised speculation as to the\nL1031: future of Trudeau's leadership, with renewed calls for his resignation emerging\nL1032: from Liberal MPs. \\[361\\]\\[363\\] The government's economic statement, released\nL1033: later that day, showed a deficit of $61.9 billion for 2023–24, exceeding the\nL1034: previous target of $40.1 billion or less, and left Trump's tariff threats largely\nL1035: unaddressed. \\[364\\]\nL1036: \nL1037: On January 6, 2025, citing that Canada \"\\[deserved\\] a real choice in the next\nL1038: election\", and that he was facing \"internal battles\" he felt would be a\nL1039: distraction, Trudeau announced during a news conference at Rideau Cottage that he\nL1040: would tender his resignation as leader of the Liberal Party, and as prime\nL1041: minister of Canada after the party elects his successor. \\[365\\] He also\nL1042: announced that Governor General Mary Simon would prorogue Parliament until March\nL1043: 24, while the party organizes and holds its next leadership election. On January\nL1044: 15, Trudeau subsequently confirmed he would not seek re-election in his riding of\nL1045: Papineau. \\[366\\] On March 9, the Liberal Party elected Mark Carney as the new\nL1046: leader, and the transition of power from Trudeau to Carney began the following\nL1047: day. \\[367\\] On March 14, Trudeau formally notified the governor general of his\nL1048: resignation. Carney was sworn in as the 24th prime minister of Canada later that\nL1049: morning. \\[368\\]\nL1050: \nL1051: ## Post-premiership (2025–present)\nL1052: \nL1053: In April 2025, Trudeau made his first public engagement following his\nL1054: resignation, campaigning for Liberal candidate Marjorie Michel in his former\nL1055: riding of Papineau. He was also present for the 2025 Speech from the Throne in\nL1056: May, along with former prime ministers Stephen Harper and Kim Campbell.\nL1057: \\[369\\]\\[370\\]\\[371\\] In January 2026, he attended the World Economic Forum's\nL1058: annual meeting in Davos, Switzerland. \\[372\\]\nL1059: \nL1060: Retrospective news coverage is split on Trudeau's premiership. The Canadian Press\nL1061: identified cannabis legalization, Indigenous reconciliation initiatives, the\nL1062: Canada Child Benefit, federal carbon pricing, the COVID-19 pandemic response, and\nL1063: the renegotiation of the North American Free Trade Agreement (NAFTA) into the\nL1064: Canada-United States-Mexico Agreement (CUSMA) as major elements of his tenure,\nL1065: while noting that electoral reform was a prominent 2015 promise that was not\nL1066: fulfilled. \\[373\\] Reuters noted that Trudeau became one of Canada's\nL1067: longest-serving prime ministers and won praise from progressives for his\nL1068: government's gender parity policies, but that his popularity declined amid rising\nL1069: grocery and housing costs exacerbated by the 2021–2023 inflation surge, caucus\nL1070: unrest due to poor opinion polling and by-election losses, and criticism\nL1071: following Chrystia Freeland's resignation. \\[374\\] _The Wall Street Journal_\nL1072: similarly reported that his standing fell as voters reacted to rising living\nL1073: costs, housing shortages, immigration and climate policies, and controversies\nL1074: including the SNC-Lavalin affair and blackface revelations. \\[375\\] Regarding his\nL1075: environmental record, _The Hill Times_ characterized Trudeau's tenure as a decade\nL1076: of experimental policy, contrasting it with what it characterized as a more\nL1077: pragmatic approach under his successor, Mark Carney. \\[376\\]\nL1078: \nL1079: ### Family and relationships\nL1080: \nL1081: Trudeau with his wife Sophie Grégoire at the 2017 Global Citizen Festival in\nL1082: Hamburg on the eve of the G20 Hamburg summit\nL1083: \nL1084: Trudeau first met Sophie Grégoire when they were both children growing up in\nL1085: Montreal; Grégoire was a classmate and childhood friend of Trudeau's youngest\nL1086: brother, Michel. \\[377\\] They reconnected as adults in June 2003, when Grégoire,\nL1087: by then a Quebec television personality, was assigned as Trudeau's co-host for a\nL1088: charity ball; they began dating several months later. Trudeau and Grégoire\nL1089: became engaged in October 2004 and married on May 28, 2005, in a ceremony at\nL1090: Montreal's Sainte-Madeleine d'Outremont Church. \\[378\\] They have three children:\nL1091: a son, Xavier, a daughter, Ella-Grace, and a second son, Hadrien. \\[379\\]\nL1092: \nL1093: In June 2013, two months after Trudeau became the leader of the Liberal Party,\nL1094: the couple sold their home in the Côte-des-Neiges neighbourhood of Montreal.\nL1095: \\[380\\] They began living in a rented home in Ottawa's Rockcliffe Park, the\nL1096: neighbourhood near where Trudeau resided as a child during his father's time as\nL1097: prime minister. \\[380\\]\nL1098: \nL1099: On August 18, 2014, an intruder broke into the house while Grégoire and the\nL1100: couple's three children were sleeping and left a threatening note; however,\nL1101: nothing was stolen and there was no damage to the property. Following the\nL1102: incident, Trudeau, who was in Winnipeg at the time of the break-in, stated his\nL1103: intention to inquire with the Royal Canadian Mounted Police about his home\nL1104: security. \\[381\\] After his 2015 electoral victory, Trudeau opted to live at\nL1105: Rideau Cottage, on the grounds of Rideau Hall. \\[382\\]\nL1106: \nL1107: On August 2, 2023, Trudeau announced he and Grégoire had separated. \\[383\\] On\nL1108: August 21, Trudeau said he was focusing on his children and the future. \\[384\\]\nL1109: \nL1110: Trudeau and Perry in June 2026\nL1111: \nL1112: In 2025, it was reported that Trudeau was dating American singer Katy Perry.\nL1113: \\[385\\]\\[386\\]\\[387\\] On December 6, the two confirmed their relationship on\nL1114: Instagram. \\[388\\]\\[389\\]\nL1115: \nL1116: Trudeau resided in Ottawa for a year following his resignation as prime minister.\nL1117: In February 2026, he purchased a family home in the Montreal borough of Outremont\nL1118: after announcing he would be moving back to Montreal. The real estate documents\nL1119: indicate Trudeau is the sole owner of the property and state that he and\nL1120: Grégoire Trudeau are in the process of divorcing. \\[390\\]\nL1121: \nL1122: ### Religion\nL1123: \nL1124: Trudeau's father was a practising Catholic \\[391\\] and his mother converted from\nL1125: Anglicanism to Catholicism just before their wedding. \\[392\\] Trudeau himself\nL1126: became a lapsed Catholic at age 18, as he felt that much of his day-to-day life\nL1127: was not addressed by the formality and structure of the church. \\[47\\]\\[393\\]\nL1128: Trudeau described his faith during this period as \"like so many Catholics across\nL1129: this country, I said, 'OK, I'm Catholic, I'm of faith, but I'm just not really\nL1130: going to go to church. Maybe on Easter, maybe midnight Mass at Christmas.'\"\nL1131: \\[47\\]\\[393\\] After the death of his brother Michel in 1998, Trudeau was\nL1132: persuaded by a friend to participate in an Alpha course, during which he regained\nL1133: his faith. \\[47\\]\\[393\\] In 2011, Trudeau stated, \"My own personal faith is an\nL1134: extremely important part of who I am and the values that I try to lead with.\"\nL1135: \\[394\\]\nL1136: \nL1137: ## Honours\nL1138: \nL1139: According to Canadian protocol, as a former prime minister, he is styled \" The\nL1140: Right Honourable\" for life.\nL1141: \nL1142: Ribbon\nL1143: \nL1144: Description\nL1145: \nL1146: Notes\nL1147: \nL1148: Queen Elizabeth II Diamond Jubilee Medal for Canada\nL1149: \nL1150: - February 6, 2012: As an elected Member of the House of Commons of Canada,\nL1151: Trudeau was awarded the medal as a member of the Canadian order of precedence.\nL1152: \\[395\\]\nL1153: \nL1154: Grand Cross of the Order of La Pléiade\nL1155: \nL1156: - June 19, 2019: Trudeau received this honorary award from the International\nL1157: Organization of La Francophonie. \\[396\\]\nL1158: \nL1159: Order of Liberty (Ukraine)\nL1160: \nL1161: - August 23, 2024: Trudeau was awarded this distinction by President Volodymyr\nL1162: Zelenskyy for outstanding contributions to strengthening Ukrainian-Canadian\nL1163: relations, supporting Ukraine's state sovereignty, and territorial integrity.\nL1164: \\[397\\]\nL1165: \nL1166: King Charles III Coronation Medal (Canadian Version)\nL1167: \nL1168: - June 20, 2025: As a former Prime Minister of Canada, Trudeau was awarded the\nL1169: medal as a member of the Canadian order of precedence. \\[398\\]\nL1170: \nL1171: Coat of arms of Justin Trudeau \\[399\\]\nL1172: \nL1173: Following the death of his father, Pierre Trudeau, on September 8, 2000, Justin\nL1174: Trudeau inherited his father’s arms and crest, \\[399\\] which had originally\nL1175: been granted by the Canadian Heraldic Authority on December 7, 1994. \\[400\\]\nL1176: \nL1177: Honorary degrees\nL1178: \nL1179: Location Date School Degree Gave commencement address Scotland **July 5,\nL1180: 2017**University of Edinburgh Doctorate Yes \\[401\\]\\[402\\] New York **May 16,\nL1181: 2018**New York University Doctor of Laws (LL.D.)Yes \\[403\\]\\[404\\]\nL1182: \nL1183: Other awards and honours\nL1184: \nL1185: Year Awarded Awarder Reference 2018 Polio Eradication Champion Award Rotary\nL1186: International\\[405\\]2020 Honorary Fellowship Royal Canadian Geographical\nL1187: Society\\[406\\]2025 Global Leadership Award Chicago Council on Global\nL1188: Affairs\\[407\\]\nL1189: \nL1190: ## Published works\nL1191: \nL1192: - Trudeau, Justin (October 20, 2014). _Common Ground_. Toronto, Ontario:\nL1193: HarperCollins Publishers Ltd. ISBN\nL1194: \nL1195: 978-1-4434-3337-2\nL1196: \nL1197: . OCLC 893647393.\nL1198: \nL1199: ## Notes\nL1200: \nL1201: 1. ↑ Trudeau was succeeded as minister of intergovernmental affairs on July 18,\nL1202: 2018, but continued to serve as minister of youth until November 19, 2019.\nL1203: \nL1204: 2. ↑ The Cabinet position was titled \"minister of infrastructure, communities\nL1205: and intergovernmental affairs\".\nL1206: \nL1207: 3. ↑ LeBlanc succeeded Trudeau in the Cabinet position, but with the title\nL1208: \"minister of intergovernmental and northern affairs and internal trade\".\nL1209: \nL1210: 4. ↑ Pronounced /ˈ t r uː d oʊ, t r uːˈ d oʊ/ ⓘ _TROO-doh, troo- DOH_;\nL1211: French: \\[ʒystɛ̃ pjɛʁ dʒɛms tʁydo\\].\nL1212: \nL1213: ## References\nL1214: \nL1215: 001. ↑ Griffin, Eugene (March 6, 1971). \"Trudeau's Bride Takes All by\nL1216: Surprise\". _Chicago Tribune_. Chicago Tribune Press Services. Archived from the\nL1217: original on March 5, 2017. Retrieved September 4, 2016.\nL1218: \nL1219: 002. ↑\"Rumors confirmed: Mrs. Trudeau expecting, due December\". _Montreal\nL1220: Gazette_. The Canadian Press. June 24, 1971. Archived from the original on May 2,\nL1221: 2021. Retrieved May 22, 2016.\nL1222: \nL1223: 003. ↑\"Civic doctor for Margaret\". _Ottawa Citizen_. December 1, 1971. Archived\nL1224: from the original on December 18, 2021. Retrieved October 7, 2017.\nL1225: \nL1226: 004.
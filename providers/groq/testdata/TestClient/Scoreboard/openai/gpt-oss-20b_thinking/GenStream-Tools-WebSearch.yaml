            data: {"id":"chatcmpl-37563bc9-0391-41e5-a47b-f37585e3e4f3","object":"chat.completion.chunk","created":1790988250,"model":"openai/gpt-oss-20b","system_fingerprint":"fp_3023a70d60","choices":[{"index":0,"delta":{"executed_tools":[{"name":"browser.open","index":3,"type":"browser.open","arguments":"{\"cursor\": 2, \"id\": 0}","output":"L0: \nL1: URL: https://en.wikipedia.org/wiki/Prime_Minister_of_Canada\nL2: Prime Minister of Canada\nL3: \nL4: Prime Minister of Canada _Premier ministre du Canada_Incumbent\nL5: \nL6: Mark Carney\nL7: \nL8: since March 14, 2025 Government of Canada\nL9: \nL10: Privy Council Office Style The Right Honourable \\[note 1\\]\\[1\\]\nL11: \nL12: (formal) Prime Minister \\[1\\]\nL13: \nL14: (informal) Abbreviation PM Member of Parliament Privy Council Cabinet\nL15: \\[2\\]Reports to House of Commons Residence 24 Sussex Drive ( _de jure_)\nL16: \nL17: Rideau Cottage ( _de facto_)Seat Office of the Prime Minister and Privy Council\nL18: building Appointer Monarch (represented by the governor general) \\[3\\]with the\nL19: confidence of the House of Commons \\[4\\]Term length At His Majesty's pleasure\nL20: Constituting instrument None (constitutional convention)Inaugural holder John A.\nL21: Macdonald Formation July 1, 1867 Deputy Deputy Prime Minister Salary CA$ 435,400\nL22: (2026) \\[5\\]Website pm.gc.ca\nL23: \nL24: The **prime minister of Canada**\\[a\\] is the head of government of Canada. Under\nL25: the Westminster system, the prime minister governs with the confidence of a\nL26: majority of the elected House of Commons; as such, the prime minister typically\nL27: sits as a member of Parliament (M.P.) and leads the largest party or a coalition\nL28: of parties. As first minister, the prime minister selects ministers to form the\nL29: Cabinet.\nL30: \nL31: Not outlined in any constitutional document, the prime minister is appointed by\nL32: the monarch's representative, the governor general, and the office exists per\nL33: long-established convention. Constitutionally, executive authority is vested in\nL34: the monarch (who is the head of state), but the powers of the monarch and\nL35: governor general are nearly always exercised on the advice of the Cabinet, \\[6\\]\nL36: which is collectively responsible to the House of Commons. Canadian prime\nL37: ministers are appointed to the Privy Council and styled as the Right Honourable\nL38: (French: _le très honorable_), \\[note 2\\] a privilege maintained for life.\nL39: \nL40: The prime minister is supported by the Prime Minister's Office and heads the\nL41: Privy Council Office. \\[7\\] The prime minister also selects individuals for\nL42: appointment as governor general, provincial lieutenant governors, territorial\nL43: commissioners, as well as to the Senate of Canada, Supreme Court of Canada, other\nL44: federal courts, and senior members of the military and public service.\nL45: \nL46: Mark Carney is the current prime minister of Canada, taking office on March 14,\nL47: 2025. Since Canadian Confederation in 1867, 24 prime ministers have formed 30\nL48: ministries. \\[8\\]\nL49: \nL50: ## Origin of the office\nL51: \nL52: The position of prime minister is not outlined in any Canadian constitutional\nL53: document and is mentioned only in a few sections of the _Constitution Act, 1982_,\nL54: \\[9\\]\\[10\\] and in the _Letters Patent, 1947_ issued by King George VI. \\[11\\]\nL55: The office and its functions are instead governed by constitutional conventions\nL56: and modelled on the same office in the United Kingdom.\nL57: \nL58: ## Qualifications and selection\nL59: \nL60: In 2008, a public-opinion survey showed that 51 per cent of Canadians believed\nL61: they voted to directly elect the prime minister. \\[14\\] In fact, the prime\nL62: minister, along with the other ministers in Cabinet, is appointed by the governor\nL63: general on behalf of the monarch. \\[15\\] By the conventions of responsible\nL64: government, the foundation of parliamentary democracy, the governor general will\nL65: call to form a government the individual most likely to receive the support, or\nL66: confidence, of a majority of the directly elected members of the House of\nL67: Commons; \\[16\\] as a practical matter, this is often the leader of the party, or\nL68: a coalition of parties, \\[17\\]\\[18\\] whose members form a majority, or a very\nL69: large plurality, of seats in the House of Commons. \\[19\\] No document is needed\nL70: to begin the appointment; both the invitation and acceptance are usually oral.\nL71: \\[20\\]\nL72: \nL73: A prime minister who has given intention to resign may advise the governor\nL74: general on whom to appoint as the next prime minister. However, if the prime\nL75: minister is resigning because he or she has lost the confidence of the House of\nL76: Commons, the viceroy is not obligated to follow that advice. \\[20\\] If the leader\nL77: of the opposition is unable or unwilling to form a government, \\[note 3\\] the\nL78: governor general can consult whomever he or she wishes. \\[20\\]\nL79: \nL80: While there is no legal requirement for the prime minister to be an M.P., \\[20\\]\nL81: for practical and political reasons the prime minister is expected to win a seat\nL82: very promptly. \\[22\\] However, in rare circumstances, individuals who are not\nL83: sitting members of the House of Commons have been appointed to the position of\nL84: prime minister. Two former prime ministers— John Joseph Caldwell Abbott and\nL85: Mackenzie Bowell—served in the 1890s while members of the Senate. \\[23\\] Both,\nL86: in their roles as government leader in the Senate, succeeded prime ministers who\nL87: had died in office— John A. Macdonald in 1891 and John Sparrow David Thompson\nL88: in 1894.\nL89: \nL90: John A. Macdonald, the first prime minister of Canada (1867–1873, 1878–1891)\nL91: \nL92: Prime ministers who are not M.P.s upon their appointment (or who lose their seats\nL93: while in office) have since been expected to seek election to the House of\nL94: Commons as soon as possible. For example, William Lyon Mackenzie King, after\nL95: losing his seat in the 1925 federal election and again in the 1945 Canadian\nL96: federal election (despite his party being elected government both times), briefly\nL97: governed without a seat in the House of Commons on both occasions before winning\nL98: a by-election a few weeks later. Similarly, John Turner replaced Pierre Trudeau\nL99: as leader of the Liberal Party in 1984 and subsequently was appointed prime\nL100: minister while not holding a seat in the House of Commons; Turner won a riding in\nL101: the next election, but the Liberal Party was swept from power.\nL102: \nL103: When a prime minister loses his or her seat in the legislature, or should a new\nL104: prime minister be appointed without holding a seat, the typical process that\nL105: follows is that a member in the governing political party will resign to allow\nL106: the prime minister to run in the resulting by-election. \\[23\\] A safe seat is\nL107: usually chosen; while the Liberal and Conservative parties generally observed a\nL108: practice of not running a candidate against another party's new leader in the\nL109: by-election, the New Democratic Party and smaller political parties typically do\nL110: not follow the same practice. \\[24\\] However, if the governing party selects a\nL111: new leader shortly before an election is due, and that new leader is not a member\nL112: of the legislature, they will normally await the upcoming election before running\nL113: for a seat in Parliament.\nL114: \nL115: ## Term of office\nL116: \nL117: The prime minister serves _at His Majesty's pleasure_, meaning the post does not\nL118: have a fixed term, and once appointed and sworn in by the governor general, the\nL119: prime minister remains in office until he or she resign, is dismissed, or dies.\nL120: \\[25\\]\nL121: \nL122: While the life-span of a parliament is constitutionally limited to five years, a\nL123: 2007 amendment to the _Canada Elections Act_, Section 56.1(2) limited the term of\nL124: a Parliament to four years, with election day being set as the third Monday in\nL125: October of the fourth calendar year after the previous polling date. \\[26\\] The\nL126: governor general may still, on the advice of the prime minister, dissolve\nL127: parliament and issue the writs of election prior to the date mandated by the\nL128: constitution or _Canada Elections Act_; the King–Byng Affair was the only time\nL129: since Confederation that the governor general refused the prime minister's\nL130: request for a general vote.\nL131: \nL132: Following parliamentary dissolution, should the prime minister's party\nL133: subsequently win a majority of seats in the House of Commons, it is unnecessary\nL134: to reappoint the prime minister or for the prime minister to retake the oath of\nL135: office. \\[25\\] If, however, an opposition party wins a majority of seats, the\nL136: prime minister may resign or choose to meet Parliament to see if the incumbent\nL137: government can win a confidence vote. Should the prime minister's party achieve a\nL138: minority while an opposition party wins a plurality (i.e., more seats than any\nL139: other party but less than a majority), the prime minister can attempt to maintain\nL140: the confidence of the House by forming a coalition with other minority parties,\nL141: which was last entertained in 1925 or by entering into a confidence-and-supply\nL142: agreement, or by winning support of other parties on a vote-by-vote basis. \\[\nL143: _citation needed_\\]\nL144: \nL145: ## Role and authority\nL146: \nL147: Canada's prime ministers during its first century\nL148: \nL149: Because the prime minister is, in practice, the most politically powerful member\nL150: of the Canadian government, he or she is sometimes erroneously thought to be\nL151: Canada's head of state, \\[note 4\\] when in fact that role belongs to the Canadian\nL152: monarch, represented by the governor general. \\[28\\] The prime minister is\nL153: instead the head of government and is responsible for advising the Crown on how\nL154: to exercise much of the royal prerogative and its executive powers, \\[17\\] which\nL155: are governed by the written constitution and constitutional conventions. However,\nL156: the function of the prime minister has evolved with increasing power. Today, per\nL157: the doctrines of constitutional monarchy, the advice given by the prime minister\nL158: is ordinarily binding, meaning the prime minister effectively carries out those\nL159: duties ascribed to the sovereign or governor general, leaving the latter to act\nL160: in predominantly ceremonial fashions. \\[29\\] As such, the prime minister,\nL161: supported by the Office of the Prime Minister (P.M.O.), controls the appointments\nL162: of many key figures in Canada's system of governance, including the governor\nL163: general, the Cabinet, justices of the Supreme Court, senators, heads of Crown\nL164: corporations, ambassadors and high commissioners, the provincial lieutenant\nL165: governors, and approximately 3,100 other positions. Further, the prime minister\nL166: plays a prominent role in the legislative process—with the majority of bills\nL167: put before Parliament originating in the Cabinet.\nL168: \nL169: William Lyon Mackenzie King, the 10th prime minister of Canada (1921–1926;\nL170: 1926–1930; 1935–1948)\nL171: \nL172: Pierre Trudeau is often credited with, throughout his tenure as prime minister\nL173: (1968–79, 1980–84), consolidating power in the P.M.O., \\[30\\] which is itself\nL174: filled by political and administrative staff selected at the prime minister's\nL175: discretion and unaccountable to Parliament. At the end of the 20th century and\nL176: into the 21st, analysts—such as Jeffrey Simpson, \\[31\\] Donald Savoie, Andrew\nL177: Coyne, \\[32\\] and John Gomery—argued that both Parliament and the Cabinet had\nL178: become eclipsed by prime ministerial power; \\[note 5\\]\\[33\\] Savoie wrote: \"The\nL179: Canadian prime minister has little in the way of institutional check, at least\nL180: inside government, to inhibit his ability to have his way.\" \\[34\\] Indeed, the\nL181: position has been described as undergoing a \"presidentialization\", \\[30\\]\\[35\\]\nL182: to the point that its incumbents publicly outshine the actual head of state (and\nL183: prime minister's spouses are sometimes referred to as _First Lady of\nL184: Canada_\\[36\\]\\[37\\]). \\[38\\]\\[39\\] Former governor general Adrienne Clarkson\nL185: alluded to what she saw as \"an unspoken rivalry\" that had developed between the\nL186: prime minister and the Crown. \\[40\\] It has been theorized that such is the case\nL187: in Canada as its Parliament is less influential on the executive than in other\nL188: countries with Westminster parliamentary systems; particularly, Canada has fewer\nL189: M.P.s, a higher turnover rate of M.P.s after each election, and a U.S.-style\nL190: system for selecting political party leaders, leaving them accountable to the\nL191: party membership rather than caucus (as is the case in the U.K.). \\[41\\]\nL192: \nL193: There do exist checks on the prime minister's power: the House of Commons may\nL194: revoke its confidence in an incumbent prime minister and Cabinet or caucus\nL195: revolts can quickly bring down a serving premier and even mere threats of such\nL196: action can persuade or compel a prime minister to resign, as happened with Jean\nL197: Chrétien. The _Reform Act, 2014_, \\[42\\] codifies the process by which a caucus\nL198: may trigger a party leadership review and, if necessary, chose an interim leader,\nL199: thereby making a prime minister more accountable to the M.P.s in one's party.\nL200: Caucuses may choose to follow these rules, though the decision would be made by\nL201: recorded vote, thereby subjecting the party's choice to public scrutiny. \\[43\\]\nL202: \nL203: The Senate may delay or impede legislation put forward by the Cabinet, such as\nL204: when Brian Mulroney's bill creating the Goods and Services Tax (G.S.T.) came\nL205: before the Senate, and given Canada's federal nature, the jurisdiction of the\nL206: federal government is limited to areas prescribed by the constitution. Further,\nL207: as executive power is constitutionally vested in the monarch, meaning the royal\nL208: prerogative belongs to the Crown and not to any of its ministers,\nL209: \\[44\\]\\[45\\]\\[46\\] the sovereign's supremacy over the prime minister in the\nL210: constitutional order is thus seen as a \"rebuff to the pretensions of the elected:\nL211: As it has been said, when the prime minister bows before the queen, he bows\nL212: before us \\[the Canadian people\\].\" \\[47\\]\\[48\\] Either the sovereign or the\nL213: governor general may therefore oppose the prime minister's will in extreme crisis\nL214: situations. \\[note 6\\] Near the end of her time as governor general, Adrienne\nL215: Clarkson stated: \"My constitutional role has lain in what are called 'reserve\nL216: powers': making sure that there is a prime minister and a government in place,\nL217: and exercising the right 'to encourage, to advise, and to warn'\\[...\\] Without\nL218: really revealing any secrets, I can tell you that I have done all three.\" \\[49\\]\nL219: \nL220: ## Privileges\nL221: \nL222: 24 Sussex Drive, the official residence of the prime minister of Canada\nL223: \nL224: Two official residences are provided to the prime minister— 24 Sussex Drive in\nL225: Ottawa and Harrington Lake, a country retreat in Gatineau Park—as well an\nL226: office in the Office of the Prime Minister and Privy Council building (formerly\nL227: known as Langevin Block), across from Parliament Hill. \\[50\\]\nL228: \nL229: For transportation, the prime minister is afforded an armoured car (a car\nL230: allowance of $2,000 per year) and shared use of two official aircraft—an Airbus\nL231: CC-330 Husky for international flights and a Bombardier CC-144 Challenger for\nL232: domestic trips. The Royal Canadian Mounted Police also furnish constant personal\nL233: security for the prime minister and his or her family. All of the aforementioned\nL234: is provided through budgets approved by Parliament.\nL235: \nL236: As of April 2024, the prime minister's annual salary is $406,200 \\[51\\]\nL237: (consisting of an M.P.'s salary of $203,100 and the prime minister's additional\nL238: salary of $203,100). \\[52\\]\nL239: \nL240: A serving or former prime minister is accorded a state funeral, wherein his or\nL241: her casket lies in state in the Centre Block of Parliament Hill. \\[53\\] Bennett\nL242: was the only former prime minister of Canada to die and be buried outside the\nL243: country. John Thompson also died outside Canada, at Windsor Castle, where Queen\nL244: Victoria permitted his lying-in-state before his body was returned to Canada for\nL245: a state funeral in Halifax. \\[54\\]\nL246: \nL247: The mark of the prime ministership of Canada, applied to the arms of prime\nL248: ministers\nL249: \nL250: Prior to 1919, it was traditional for the monarch to bestow a knighthood on newly\nL251: appointed Canadian prime ministers. Accordingly, several carried the prefix _Sir_\nL252: before their names; of the first eight prime ministers of Canada, only Alexander\nL253: Mackenzie refused the honour of a knighthood. Following the 1919 Nickle\nL254: Resolution, however, the House of Commons declared that it should be against the\nL255: policy of the Canadian Sovereign (and the Canadian government advising the\nL256: Monarch when such honours are not within the Monarch's personal gift) to bestow\nL257: aristocratic or chivalric titles to Canadians. The Crown in right of Canada (but\nL258: not the Crown in right of the United Kingdom, which has periodically bestowed\nL259: such Imperial honours on such citizens) has since adopted this policy generally,\nL260: such that the last prime minister to be knighted near appointment was Robert\nL261: Borden, who was the prime minister at the time the Nickle Resolution was debated\nL262: in the House of Commons (and was knighted before the resolution). Still, Bennett\nL263: was, in 1941, six years after he stepped down as prime minister, elevated to the\nL264: peerage of the United Kingdom by King George VI as Viscount Bennett, of Mickleham\nL265: in the County of Surrey and of Calgary and Hopewell in Canada. \\[55\\]\\[56\\] No\nL266: prime minister has since been titled.\nL267: \nL268: The Canadian Heraldic Authority (C.H.A.) grants former prime ministers an\nL269: augmentation of honour on the coat of arms of those who apply for them. The\nL270: heraldic badge, referred to by the C.H.A. as the _mark of the Prime Ministership\nL271: of Canada_, \\[57\\] consists of four red maple leaves joined at the stem on a\nL272: white field ( _Argent four maple leaves conjoined in cross at the stem Gules_);\nL273: the augmentation is usually a canton or centred in the chief.\nL274: \\[57\\]\\[58\\]\\[59\\]\\[60\\]\\[61\\] Joe Clark, \\[57\\] Pierre Trudeau, \\[58\\] John\nL275: Turner, \\[59\\] Brian Mulroney, \\[60\\] Kim Campbell, \\[61\\] Jean Chrétien \\[62\\]\nL276: and Paul Martin \\[63\\] were granted arms with the augmentation.\nL277: \nL278: ## Style of address\nL279: \nL280: Kim Campbell, the 19th prime minister of Canada (1993) and only female and\nL281: British Columbia–born person to hold the office\nL282: \nL283: Canada continues the Westminster tradition of using the title _Prime Minister_\nL284: when one is speaking to the federal head of government directly; the Department\nL285: of Canadian Heritage advises that the term _Mr. Prime Minister_ should not be\nL286: used in official contexts. \\[64\\] The written form of address for the prime\nL287: minister should use his or her full parliamentary title: _The Right Honourable\nL288: \\[name\\], \\[post-nominal letters\\], Prime Minister of Canada_. However, while in\nL289: the House of Commons during Question Period, other members of parliament may\nL290: address the prime minister as _the Right Honourable Member for \\[prime minister's\nL291: riding\\]_ or simply _the Right Honourable Prime Minister_. \\[65\\] Former prime\nL292: ministers retain the prefix _the Right Honourable_ for life; should they remain\nL293: sitting M.P.s, they may be referred as _the Right Honourable Member for\nL294: \\[member's riding\\]_, by their portfolio title (if appointed to one), as in _the\nL295: Right Honourable Minister of National Defence_, or should they become opposition\nL296: leaders, as _the Right Honourable Leader of the Opposition_.\nL297: \nL298: In the decades following Confederation, it was common practice to refer to the\nL299: prime minister as _Premier of Canada_, \\[66\\]\\[67\\]\\[68\\] a custom that continued\nL300: during the First World War, around the time of Robert Borden's premiership.\nL301: \\[69\\]\\[70\\]\\[71\\] While contemporary sources speak of early prime ministers of\nL302: Canada as _premier_, \\[72\\]\\[73\\]\\[74\\] the modern practice is to refer to the\nL303: federal head of government almost exclusively as the _prime minister_, while the\nL304: provincial and territorial heads of government are termed _premiers_ (in French,\nL305: premiers are addressed as _premier ministre du \\[province\\]_).\nL306: \nL307: ## Activities post-prime ministership\nL308: \nL309: Lester Pearson, 1965\nL310: \nL311: After exiting office, former prime ministers of Canada have engaged in various\nL312: pursuits. Some remained in politics: Bowell continued as a senator, and Bennett\nL313: moved to the United Kingdom and was elevated to the House of Lords. \\[75\\] A\nL314: number were leaders of the Official Opposition: John A. Macdonald, Arthur\nL315: Meighen, Mackenzie King, \\[76\\] and Pierre Trudeau, all before being reappointed\nL316: as prime minister (Mackenzie King twice); Alexander Mackenzie and John\nL317: Diefenbaker, both prior to sitting as regular Members of Parliament until their\nL318: deaths; \\[77\\] Wilfrid Laurier dying while still in the post; \\[78\\] and Charles\nL319: Tupper, \\[79\\] Louis St. Laurent, \\[80\\] and John Turner, each before they\nL320: returned to private business. Meighen was also appointed to the Senate following\nL321: his second period as prime minister, but resigned his seat to seek reelection and\nL322: moved to private enterprise after failing to win a riding. \\[81\\] Also returning\nL323: to civilian life were: Robert Borden, who was Chancellor of Queen's and McGill\nL324: Universities, as well as working in the financial sector; Lester B. Pearson, who\nL325: was Chancellor of Carleton University; \\[82\\] Joe Clark and Kim Campbell, who\nL326: were university lecturers, Clark also consultant and Campbell working in\nL327: international diplomacy and as the director of private companies and chairperson\nL328: of interest groups; while Pierre Trudeau and Jean Chrétien returned to legal\nL329: practice. \\[83\\] Former prime ministers also commonly penned\nL330: autobiographies—Tupper, \\[79\\] for example—or published their memoirs—such\nL331: as Diefenbaker and Paul Martin. \\[77\\]\nL332: \nL333: ## Notes\nL334: \nL335: 1. ↑ This title is granted to holders of the office for life upon taking\nL336: office.\nL337: \nL338: 2. ↑ When the style is held by a woman, the French title is _la très\nL339: honorable_.\nL340: \nL341: 3. ↑ When Prime Minister John A. Macdonald died in office in 1891, Governor\nL342: General the Lord Stanley of Preston approached John Thompson to form a\nL343: government. But Thompson declined and instead advised Stanley to call on Senator\nL344: John Abbott. Ahead of Prime Minister Mackenzie Bowell's resignation in 1896,\nL345: Donald Smith turned down the offer to be the next head of government, leading\nL346: Governor General the Earl of Aberdeen to appoint Charles Tupper as prime\nL347: minister. Robert Borden announced his intention to resign as prime minister in\nL348: 1920. Thomas White was summoned by Governor General the Viscount Byng of Vimy and\nL349: rejected the appointment as prime minister. Byng then installed Arthur Meighen as\nL350: his chief advisor. \\[21\\]\nL351: \nL352: 4. ↑ A 2008 Ipsos-Reid poll found 42% of respondents thought the prime minister\nL353: was head of state. \\[27\\]\nL354: \nL355: 5. ↑ See note 2 at Cabinet of Canada.\nL356: \nL357: 6. ↑ See \" Responsibilities\" and note 1 at Cabinet of Canada.\nL358: \nL359: 1. ↑ French: _premier ministre du Canada_. When the position is held by a\nL360: woman, the French title is _première ministre du Canada_.\nL361: \nL362: ## References\nL363: \nL364: 01. 1 2\"Styles of address\". Canadian Heritage. October 16, 2017. Retrieved March\nL365: 6, 2021.\nL366: \nL367: 02. ↑\"The Canadian Parliamentary system – Our Procedure – House of\nL368: Commons\". _ourcommons.ca_. Retrieved April 20, 2020.\nL369: \nL370: 03. ↑\"Constitutional Duties\". The Governor General of Canada. Archived from the\nL371: original on April 23, 2020. Retrieved April 20, 2020.\nL372: \nL373: 04. ↑\"House of Commons Procedure and Practice – 1. Parliamentary Institutions\nL374: – Canadian Parliamentary Institutions\". _ourcommons.ca_. Retrieved April 20,\nL375: 2020.\nL376: \nL377: 05. ↑\"Indemnities, Salaries and Allowances\". Parliament of Canada. Retrieved\nL378: July 2, 2025.\nL379: \nL380: 06. ↑\nL381: \nL382: Brooks, Stephen (2007). _Canadian Democracy: An Introduction_ (5 ed.). Don Mills:\nL383: Oxford University Press. pp. 233–234. ISBN\nL384: \nL385: 978-0-19-543103-2\nL386: \nL387: .\nL388: \nL389: 07. ↑\"Privy Council Office\". _The Canadian Encyclopedia_. Retrieved October 30,\nL390: 2020.\nL391: \nL392: 08. ↑\"Prime Ministers of Canada\". Library of the Canadian Parliament. Retrieved\nL393: February 26, 2023.\nL3